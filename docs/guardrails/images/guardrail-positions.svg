<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" role="img" aria-label="Input guardrail chỉ thấy câu hỏi nên phải cho qua câu hỏi hợp lệ về hoàn tiền. Output guardrail thấy đúng câu khách sẽ đọc nên chặn được câu hứa hoàn tiền 100% trước khi hiện. Hành động hoàn tiền được code của tool kiểm theo dữ liệu đơn hàng và trần số tiền, không dựa vào classifier"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
--blue:#0969da;--blue-bg:#ddf4ff;--orange:#bc4c00;--orange-bg:#fff1e5;
--red:#cf222e;--red-bg:#ffebe9;--green:#1a7f37;--green-bg:#dafbe1}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;
--slot:#3d444d;--tok:#151b23;--blue:#4493f8;--blue-bg:#0c2d6b;--orange:#db6d28;--orange-bg:#3d1e00;
--red:#f85149;--red-bg:#490202;--green:#3fb950;--green-bg:#033a16}}
.bg{fill:var(--bg)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.title{font-size:20px;font-weight:600}
.row{font-size:15px;font-weight:600}
.sub{font-size:12px;fill:var(--muted)}
.cap{font-size:14px}
.cap2{font-size:13px;fill:var(--muted)}
.lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;text-anchor:middle}
.mid{text-anchor:middle}.end{text-anchor:end}
.slot{fill:none;stroke:var(--slot);stroke-width:1.5;stroke-dasharray:4 4}
.tok{fill:var(--tok);stroke:var(--slot);stroke-width:1.5}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:2}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:2}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:2}
.hatch{fill:url(#hatch);stroke:var(--red);stroke-width:2}
.fblue{fill:var(--blue)}.forange{fill:var(--orange)}.fred{fill:var(--red)}.ffg{fill:var(--fg)}
.tblue{fill:var(--blue)}.torange{fill:var(--orange)}.tred{fill:var(--red)}
.lblue{stroke:var(--blue);stroke-width:2;fill:none}
.lorange{stroke:var(--orange);stroke-width:2;fill:none}
.lred{stroke:var(--red);stroke-width:2;fill:none}
.lmuted{stroke:var(--slot);stroke-width:1.5;fill:none}
.lfg{stroke:var(--fg);stroke-width:1.5;fill:none}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.dash{stroke-dasharray:6 4}
.grid{stroke:var(--slot);stroke-width:1;opacity:.6}
.axis{stroke:var(--muted);stroke-width:1}
.static-only{opacity:0}
@media (prefers-reduced-motion: reduce){
.a-show,.a-hide{animation:none!important}.a-show{opacity:1}.a-hide{opacity:0}.static-only{opacity:1}}
</style><defs><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fblue" d="M0,0L10,5L0,10z"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="forange" d="M0,0L10,5L0,10z"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fred" d="M0,0L10,5L0,10z"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ffg" d="M0,0L10,5L0,10z"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--red-bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--red);stroke-width:2;opacity:.55"/></pattern></defs><rect class="bg" width="980" height="440" rx="12"/><text class="title" x="20" y="38">Ba chỗ đặt guardrail, mỗi chỗ thấy một thứ khác nhau</text><rect class="blue" x="20" y="55" width="14" height="14" rx="3"/><text class="sub" x="40" y="66">guardrail: bước kiểm tra</text><rect class="hatch" x="232" y="55" width="14" height="14" rx="3"/><text class="sub" x="252" y="66">vi phạm bị chặn</text><rect class="tok" x="381" y="55" width="14" height="14" rx="3"/><text class="sub" x="401" y="66">khách, model, tool</text><rect class="tok" x="20" y="110" width="110" height="52" rx="7"/><text class="cap mid" x="75.0" y="132">Khách</text><text class="sub mid" x="75.0" y="150">gửi câu hỏi</text><rect class="blue" x="175" y="110" width="170" height="52" rx="7"/><text class="cap mid" x="260.0" y="132">Input guardrail</text><text class="sub mid" x="260.0" y="150">trước model</text><rect class="tok" x="390" y="110" width="170" height="52" rx="7"/><text class="cap mid" x="475.0" y="132">Model chính</text><text class="sub mid" x="475.0" y="150">sinh câu trả lời</text><rect class="blue" x="605" y="110" width="170" height="52" rx="7"/><text class="cap mid" x="690.0" y="132">Output guardrail</text><text class="sub mid" x="690.0" y="150">trước khi hiện</text><rect class="tok" x="820" y="110" width="130" height="52" rx="7"/><text class="cap mid" x="885.0" y="132">Màn hình</text><text class="sub mid" x="885.0" y="150">khách đọc</text><path class="lfg" d="M132,136.0L170,136.0" marker-end="url(#afg)"/><path class="lfg" d="M347,136.0L385,136.0" marker-end="url(#afg)"/><path class="lfg" d="M562,136.0L600,136.0" marker-end="url(#afg)"/><path class="lfg" d="M777,136.0L815,136.0" marker-end="url(#afg)"/><path class="lfg" d="M475,164L475,295" marker-end="url(#afg)"/><text class="sub halo" x="483" y="235.0">gọi tool issue_refund</text><rect class="blue" x="390" y="300" width="170" height="52" rx="7"/><text class="cap mid" x="475.0" y="322">Kiểm trong code tool</text><text class="sub mid" x="475.0" y="340">trước khi tool chạy</text><path class="lfg" d="M562,326.0L600,326.0" marker-end="url(#afg)"/><rect class="tok" x="605" y="300" width="170" height="52" rx="7"/><text class="cap mid" x="690.0" y="322">Hoàn tiền thật</text><text class="sub mid" x="690.0" y="340">tác dụng phụ</text><text class="cap" x="175" y="188">Chỉ thấy câu hỏi:</text><text class="sub" x="175" y="206">"giao trễ thì shop hoàn tiền không?"</text><text class="sub" x="175" y="222">hợp lệ, phải cho qua</text><text class="cap" x="605" y="188">Thấy đúng câu khách sẽ đọc:</text><rect class="hatch" x="605" y="198" width="230" height="28" rx="5"/><text class="cap halo" x="615" y="217">"Shop cam kết hoàn tiền 100%"</text><text class="sub" x="605" y="244">bị chặn trước khi hiện ra</text><text class="cap" x="120" y="318">Điều kiện là dữ liệu đơn hàng:</text><text class="sub" x="120" y="336">ngày giao dự kiến, ngày giao thật,</text><text class="sub" x="120" y="352">trạng thái thanh toán, trần số tiền</text><text class="sub" x="120" y="368">kiểm bằng code, không bằng classifier</text><text class="cap2" x="20" y="422">Chính sách kinh doanh nằm ở câu trả lời, nên phải kiểm ở output; hành động có tác dụng phụ kiểm trong code của tool.</text></svg>
