<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 610" width="940" height="610" role="img" aria-label="Cùng một lần server khựng 4,5 giây: closed-loop chỉ gửi tiếp khi có response nên bỏ 4 mốc lịch và chỉ thấy 1 request chậm, trung vị 0,5 giây; open-loop gửi đúng lịch, đo từ lúc lẽ ra được gửi, thấy 8 trên 10 request chậm, trung vị 2,75 giây"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
--blue:#0969da;--blue-bg:#ddf4ff;--orange:#bc4c00;--orange-bg:#fff1e5;
--red:#cf222e;--red-bg:#ffebe9;--green:#1a7f37;--green-bg:#dafbe1}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;
--slot:#3d444d;--tok:#151b23;--blue:#4493f8;--blue-bg:#0c2d6b;--orange:#db6d28;--orange-bg:#3d1e00;
--red:#f85149;--red-bg:#490202;--green:#3fb950;--green-bg:#033a16}}
.bg{fill:var(--bg)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.title{font-size:20px;font-weight:600}
.row{font-size:15px;font-weight:600}
.sub{font-size:12px;fill:var(--muted)}
.cap{font-size:14px}
.cap2{font-size:13px;fill:var(--muted)}
.lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;text-anchor:middle}
.mid{text-anchor:middle}.end{text-anchor:end}
.slot{fill:none;stroke:var(--slot);stroke-width:1.5;stroke-dasharray:4 4}
.tok{fill:var(--tok);stroke:var(--slot);stroke-width:1.5}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:2}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:2}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:2}
.hatch{fill:url(#hatch);stroke:var(--red);stroke-width:2}
.fblue{fill:var(--blue)}.forange{fill:var(--orange)}.fred{fill:var(--red)}.ffg{fill:var(--fg)}
.tblue{fill:var(--blue)}.torange{fill:var(--orange)}.tred{fill:var(--red)}
.lblue{stroke:var(--blue);stroke-width:2;fill:none}
.lorange{stroke:var(--orange);stroke-width:2;fill:none}
.lred{stroke:var(--red);stroke-width:2;fill:none}
.lmuted{stroke:var(--slot);stroke-width:1.5;fill:none}
.lfg{stroke:var(--fg);stroke-width:1.5;fill:none}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.dash{stroke-dasharray:6 4}
.grid{stroke:var(--slot);stroke-width:1;opacity:.6}
.axis{stroke:var(--muted);stroke-width:1}
.static-only{opacity:0}
@media (prefers-reduced-motion: reduce){
.a-show,.a-hide{animation:none!important}.a-show{opacity:1}.a-hide{opacity:0}.static-only{opacity:1}}
</style><defs><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fblue" d="M0,0L10,5L0,10z"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="forange" d="M0,0L10,5L0,10z"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fred" d="M0,0L10,5L0,10z"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ffg" d="M0,0L10,5L0,10z"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--red-bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--red);stroke-width:2;opacity:.55"/></pattern></defs><rect class="bg" width="940" height="610" rx="12"/><text class="title" x="20" y="38">Coordinated omission: closed-loop bỏ qua đúng lúc server chậm</text><rect class="blue" x="20" y="59" width="14" height="14" rx="3"/><text class="sub" x="40" y="70">request đo được, ≤ 1 s</text><rect class="hatch" x="218" y="59" width="14" height="14" rx="3"/><text class="sub" x="238" y="70">request đo được, chậm > 1 s</text><rect class="slot" x="451" y="59" width="14" height="14" rx="3"/><text class="sub" x="471" y="70">mốc lịch không gửi</text><rect x="319.1" y="100" width="290.5" height="414" style="fill:var(--tok)"/><text class="sub mid" x="464.3" y="116">server khựng 4,5 s</text><text class="row" x="20" y="144">Closed-loop</text><text class="sub" x="20" y="162">theo lịch, nhưng chờ</text><text class="sub" x="20" y="178">response mới gửi tiếp</text><rect class="blue" x="190.0" y="130" width="32.3" height="14" rx="3" style="stroke-width:1.5"/><rect class="blue" x="254.5" y="148" width="32.3" height="14" rx="3" style="stroke-width:1.5"/><rect class="hatch" x="319.1" y="166" width="322.7" height="14" rx="3" style="stroke-width:1.5"/><rect class="slot" x="383.6" y="184" width="32.3" height="14" rx="3"/><rect class="slot" x="448.2" y="202" width="32.3" height="14" rx="3"/><rect class="slot" x="512.7" y="220" width="32.3" height="14" rx="3"/><rect class="slot" x="577.3" y="238" width="32.3" height="14" rx="3"/><rect class="blue" x="641.8" y="256" width="32.3" height="14" rx="3" style="stroke-width:1.5"/><rect class="blue" x="706.4" y="274" width="32.3" height="14" rx="3" style="stroke-width:1.5"/><rect class="blue" x="770.9" y="292" width="32.3" height="14" rx="3" style="stroke-width:1.5"/><text class="cap" x="20" y="214" style="font-weight:600">6 đo được, 1 chậm</text><text class="cap" x="20" y="232" style="font-weight:600">trung vị 0,5 s</text><text class="sub halo" x="423.9" y="195">4 mốc lịch không gửi</text><text class="row" x="20" y="344">Open-loop</text><text class="sub" x="20" y="362">gửi đúng lịch, đo từ</text><text class="sub" x="20" y="378">lúc lẽ ra được gửi</text><rect class="blue" x="190.0" y="330" width="32.3" height="14" rx="3" style="stroke-width:1.5"/><rect class="blue" x="254.5" y="348" width="32.3" height="14" rx="3" style="stroke-width:1.5"/><rect class="hatch" x="319.1" y="366" width="322.7" height="14" rx="3" style="stroke-width:1.5"/><rect class="hatch" x="383.6" y="384" width="290.5" height="14" rx="3" style="stroke-width:1.5"/><rect class="hatch" x="448.2" y="402" width="258.2" height="14" rx="3" style="stroke-width:1.5"/><rect class="hatch" x="512.7" y="420" width="225.9" height="14" rx="3" style="stroke-width:1.5"/><rect class="hatch" x="577.3" y="438" width="193.6" height="14" rx="3" style="stroke-width:1.5"/><rect class="hatch" x="641.8" y="456" width="161.4" height="14" rx="3" style="stroke-width:1.5"/><rect class="hatch" x="706.4" y="474" width="129.1" height="14" rx="3" style="stroke-width:1.5"/><rect class="hatch" x="770.9" y="492" width="96.8" height="14" rx="3" style="stroke-width:1.5"/><text class="cap" x="20" y="414" style="font-weight:600">10 đo được, 8 chậm</text><text class="cap" x="20" y="432" style="font-weight:600">trung vị 2,75 s</text><text class="sub halo end" x="764.9" y="503">request cuối xong ở giây 10,5</text><line class="axis" x1="190" y1="532" x2="900" y2="532"/><line class="axis" x1="190.0" y1="532" x2="190.0" y2="537"/><text class="sub mid" x="190.0" y="550">0 s</text><line class="axis" x1="254.5" y1="532" x2="254.5" y2="537"/><text class="sub mid" x="254.5" y="550">1 s</text><line class="axis" x1="319.1" y1="532" x2="319.1" y2="537"/><text class="sub mid" x="319.1" y="550">2 s</text><line class="axis" x1="383.6" y1="532" x2="383.6" y2="537"/><text class="sub mid" x="383.6" y="550">3 s</text><line class="axis" x1="448.2" y1="532" x2="448.2" y2="537"/><text class="sub mid" x="448.2" y="550">4 s</text><line class="axis" x1="512.7" y1="532" x2="512.7" y2="537"/><text class="sub mid" x="512.7" y="550">5 s</text><line class="axis" x1="577.3" y1="532" x2="577.3" y2="537"/><text class="sub mid" x="577.3" y="550">6 s</text><line class="axis" x1="641.8" y1="532" x2="641.8" y2="537"/><text class="sub mid" x="641.8" y="550">7 s</text><line class="axis" x1="706.4" y1="532" x2="706.4" y2="537"/><text class="sub mid" x="706.4" y="550">8 s</text><line class="axis" x1="770.9" y1="532" x2="770.9" y2="537"/><text class="sub mid" x="770.9" y="550">9 s</text><line class="axis" x1="835.5" y1="532" x2="835.5" y2="537"/><text class="sub mid" x="835.5" y="550">10 s</text><line class="axis" x1="900.0" y1="532" x2="900.0" y2="537"/><text class="sub mid" x="900.0" y="550">11 s</text><text class="cap2" x="20" y="580">Giả định: lịch 1 request/giây, server xử lý tuần tự 0,5 s mỗi request, khựng từ giây 2 tới 6,5.</text><text class="cap2" x="20" y="598">Mỗi hàng là một request: thanh chạy từ lúc gửi (open-loop: lúc lẽ ra được gửi) tới lúc nhận response.</text></svg>
