<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" role="img" aria-label="Shadow: bản mới nhận bản sao traffic thật, kết quả không trả cho người dùng, chỉ để so độ trễ, lỗi, điểm judge. Canary: 1%, 5%, 25% rồi toàn bộ traffic sang bản mới, chia theo user hoặc phiên; bản cũ vẫn chạy để rollback ngay"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
--blue:#0969da;--blue-bg:#ddf4ff;--orange:#bc4c00;--orange-bg:#fff1e5;
--red:#cf222e;--red-bg:#ffebe9;--green:#1a7f37;--green-bg:#dafbe1}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;
--slot:#3d444d;--tok:#151b23;--blue:#4493f8;--blue-bg:#0c2d6b;--orange:#db6d28;--orange-bg:#3d1e00;
--red:#f85149;--red-bg:#490202;--green:#3fb950;--green-bg:#033a16}}
.bg{fill:var(--bg)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.title{font-size:20px;font-weight:600}
.row{font-size:15px;font-weight:600}
.sub{font-size:12px;fill:var(--muted)}
.cap{font-size:14px}
.cap2{font-size:13px;fill:var(--muted)}
.lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;text-anchor:middle}
.mid{text-anchor:middle}.end{text-anchor:end}
.slot{fill:none;stroke:var(--slot);stroke-width:1.5;stroke-dasharray:4 4}
.tok{fill:var(--tok);stroke:var(--slot);stroke-width:1.5}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:2}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:2}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:2}
.hatch{fill:url(#hatch);stroke:var(--red);stroke-width:2}
.fblue{fill:var(--blue)}.forange{fill:var(--orange)}.fred{fill:var(--red)}.ffg{fill:var(--fg)}
.tblue{fill:var(--blue)}.torange{fill:var(--orange)}.tred{fill:var(--red)}
.lblue{stroke:var(--blue);stroke-width:2;fill:none}
.lorange{stroke:var(--orange);stroke-width:2;fill:none}
.lred{stroke:var(--red);stroke-width:2;fill:none}
.lmuted{stroke:var(--slot);stroke-width:1.5;fill:none}
.lfg{stroke:var(--fg);stroke-width:1.5;fill:none}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.dash{stroke-dasharray:6 4}
.grid{stroke:var(--slot);stroke-width:1;opacity:.6}
.axis{stroke:var(--muted);stroke-width:1}
.static-only{opacity:0}
@media (prefers-reduced-motion: reduce){
.a-show,.a-hide{animation:none!important}.a-show{opacity:1}.a-hide{opacity:0}.static-only{opacity:1}}
</style><defs><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fblue" d="M0,0L10,5L0,10z"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="forange" d="M0,0L10,5L0,10z"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fred" d="M0,0L10,5L0,10z"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ffg" d="M0,0L10,5L0,10z"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--red-bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--red);stroke-width:2;opacity:.55"/></pattern></defs><rect class="bg" width="980" height="440" rx="12"/><text class="title" x="20" y="38">Shadow rồi canary: bản mới gặp traffic thật trước khi gặp mọi người</text><rect class="blue" x="20" y="59" width="14" height="14" rx="3"/><text class="sub" x="40" y="70">bản cũ</text><rect class="orange" x="106" y="59" width="14" height="14" rx="3"/><text class="sub" x="126" y="70">bản mới</text><line class="grid" x1="460" y1="88" x2="460" y2="420"/><text class="row" x="20" y="110">Bước 2: shadow</text><text class="sub" x="20" y="128">bản mới nhận bản sao traffic thật</text><rect class="tok" x="20" y="170" width="96" height="46" rx="7"/><text class="cap mid" x="68.0" y="198.0">Người dùng</text><rect class="tok" x="180" y="170" width="96" height="46" rx="7"/><text class="cap mid" x="228.0" y="198.0">Gateway</text><rect class="blue" x="300" y="150" width="140" height="46" rx="7"/><text class="cap mid" x="370.0" y="178.0">Bản cũ</text><rect class="orange" x="300" y="260" width="140" height="46" rx="7"/><text class="cap mid" x="370.0" y="280">Bản mới</text><text class="sub mid" x="370.0" y="297">tắt tool tác dụng phụ</text><path class="lfg " d="M118,186L176,186" marker-end="url(#afg)"/><path class="lfg dash" d="M178,202L122,202" marker-end="url(#afg)"/><text class="sub halo mid" x="148.0" y="222">trả lời</text><path class="lblue " d="M278,184L296,173.0" marker-end="url(#ablue)"/><path class="lorange dash" d="M228.0,218L296,283.0" marker-end="url(#aorange)"/><text class="sub torange halo" x="190" y="294">bản sao</text><text class="sub halo" x="180" y="330">kết quả của bản mới không trả cho người dùng,</text><text class="sub halo" x="180" y="346">chỉ để so độ trễ, lỗi, điểm judge với bản cũ</text><text class="cap" x="20" y="418">Tốn gấp đôi chi phí model cho phần traffic được sao.</text><text class="row" x="490" y="110">Bước 3, 4: canary rồi chuyển toàn bộ</text><text class="sub" x="490" y="128">chia theo user hoặc phiên, không theo request</text><text class="cap end" x="538" y="170.0">1%</text><rect class="blue" x="550" y="150" width="324.7" height="30" rx="4"/><rect class="orange" x="876.7" y="150" width="3.3" height="30" rx="3"/><text class="cap end" x="538" y="218.0">5%</text><rect class="blue" x="550" y="198" width="311.5" height="30" rx="4"/><rect class="orange" x="863.5" y="198" width="16.5" height="30" rx="3"/><text class="cap end" x="538" y="266.0">25%</text><rect class="blue" x="550" y="246" width="245.5" height="30" rx="4"/><rect class="orange" x="797.5" y="246" width="82.5" height="30" rx="3"/><text class="cap end" x="538" y="314.0">100%</text><rect class="orange" x="550" y="294" width="330" height="30" rx="4"/><rect class="blue" x="550" y="342" width="330" height="30" rx="4" style="stroke-dasharray:6 4;fill:none"/><text class="sub mid" x="715.0" y="361.0">bản cũ vẫn chạy, không nhận traffic</text><text class="cap" x="490" y="400">Mỗi mức: so lỗi, TTFT, refusal, điểm judge giữa hai nhóm.</text><text class="cap" x="490" y="418">Bản cũ còn chạy thì rollback không chờ khởi động.</text></svg>
