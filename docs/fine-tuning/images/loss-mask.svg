<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" role="img" aria-label="Mặc định TRL tính loss trên mọi token, cả system và user; với assistant_only_loss chỉ 8/30 token của đáp án và token dừng được tính. Ví dụ 440 token với max_length 128 bị cắt giữa lượt user: mặc định model học trên ví dụ không có đáp án, còn với assistant_only_loss ví dụ bị bỏ mà không có cảnh báo"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
--blue:#0969da;--blue-bg:#ddf4ff;--orange:#bc4c00;--orange-bg:#fff1e5;
--red:#cf222e;--red-bg:#ffebe9;--green:#1a7f37;--green-bg:#dafbe1}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;
--slot:#3d444d;--tok:#151b23;--blue:#4493f8;--blue-bg:#0c2d6b;--orange:#db6d28;--orange-bg:#3d1e00;
--red:#f85149;--red-bg:#490202;--green:#3fb950;--green-bg:#033a16}}
.bg{fill:var(--bg)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.title{font-size:20px;font-weight:600}
.row{font-size:15px;font-weight:600}
.sub{font-size:12px;fill:var(--muted)}
.cap{font-size:14px}
.cap2{font-size:13px;fill:var(--muted)}
.lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;text-anchor:middle}
.mid{text-anchor:middle}.end{text-anchor:end}
.slot{fill:none;stroke:var(--slot);stroke-width:1.5;stroke-dasharray:4 4}
.tok{fill:var(--tok);stroke:var(--slot);stroke-width:1.5}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:2}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:2}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:2}
.hatch{fill:url(#hatch);stroke:var(--red);stroke-width:2}
.fblue{fill:var(--blue)}.forange{fill:var(--orange)}.fred{fill:var(--red)}.ffg{fill:var(--fg)}
.tblue{fill:var(--blue)}.torange{fill:var(--orange)}.tred{fill:var(--red)}
.lblue{stroke:var(--blue);stroke-width:2;fill:none}
.lorange{stroke:var(--orange);stroke-width:2;fill:none}
.lred{stroke:var(--red);stroke-width:2;fill:none}
.lmuted{stroke:var(--slot);stroke-width:1.5;fill:none}
.lfg{stroke:var(--fg);stroke-width:1.5;fill:none}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.dash{stroke-dasharray:6 4}
.grid{stroke:var(--slot);stroke-width:1;opacity:.6}
.axis{stroke:var(--muted);stroke-width:1}
.static-only{opacity:0}
@media (prefers-reduced-motion: reduce){
.a-show,.a-hide{animation:none!important}.a-show{opacity:1}.a-hide{opacity:0}.static-only{opacity:1}}
</style><defs><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fblue" d="M0,0L10,5L0,10z"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="forange" d="M0,0L10,5L0,10z"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fred" d="M0,0L10,5L0,10z"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ffg" d="M0,0L10,5L0,10z"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--red-bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--red);stroke-width:2;opacity:.55"/></pattern></defs><rect class="bg" width="900" height="490" rx="12"/><text class="title" x="20" y="38">Token nào được tính loss khi SFT bằng TRL</text><rect class="orange" x="540" y="27" width="14" height="14" rx="3"/><text class="sub" x="560" y="38">tính loss</text><rect class="tok" x="647" y="27" width="14" height="14" rx="3"/><text class="sub" x="667" y="38">không tính</text><rect class="slot" x="761" y="27" width="14" height="14" rx="3"/><text class="sub" x="781" y="38">bị cắt</text><text class="cap2" x="20" y="62">Phần được tính loss theo các test trong t_masking.py (TRL 1.17.1); số token đếm bằng chat template của Qwen2.5-0.5B-Instruct.</text><text class="row" x="250" y="104">Ví dụ ngắn: 30 token</text><text class="row" x="20" y="134">Mặc định</text><text class="sub" x="20" y="152">cả system và user</text><rect class="orange" x="250.0" y="118" width="140.0" height="40" rx="5"/><text class="cap mid" x="320.0" y="143.0">system: Phân loại.</text><rect class="orange" x="392.0" y="118" width="140.0" height="40" rx="5"/><text class="cap mid" x="462.0" y="143.0">user: Huỷ đơn DH-1</text><rect class="orange" x="53