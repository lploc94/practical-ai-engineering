ass="row" x="20" y="378">assistant_only_loss</text><text class="sub" x="20" y="396">che hết, TRL bỏ ví dụ</text><rect class="tok" x="250.0" y="362" width="173.5" height="40" rx="5"/><rect class="slot" x="425.5" y="362" width="424.5" height="40" rx="5"/><text class="cap mid" x="637.8" y="387.0">bị cắt khỏi ví dụ</text><line class="lfg dash" x1="424.5" y1="298" x2="424.5" y2="412"/><text class="sub mid" x="424.5" y="428">token 128</text><text class="cap2" x="20" y="460">TRL cắt từ cuối (keep_start): cắt mất đáp án và token dừng. Lọc ví dụ quá dài trước khi tới trainer.</text><text class="cap2" x="20" y="478">Ví dụ ngắn vẽ không theo tỉ lệ token; ví dụ dài vẽ theo tỉ lệ. Chat template tự thêm system mặc định.</text></svg>
