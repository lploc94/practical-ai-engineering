<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-label="Lead agent lập kế hoạch rồi sinh các sub-agent chạy song song; mỗi sub-agent tìm kiếm trong context riêng và chỉ gửi bản tóm tắt, thường 1.000 đến 2.000 token, về context của lead; một agent riêng gắn trích dẫn trước khi trả báo cáo"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
--blue:#0969da;--blue-bg:#ddf4ff;--orange:#bc4c00;--orange-bg:#fff1e5;
--red:#cf222e;--red-bg:#ffebe9;--green:#1a7f37;--green-bg:#dafbe1}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;
