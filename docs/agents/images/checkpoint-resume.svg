<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1112 462" width="1112" height="462" role="img" aria-label="Process chết sau khi refund đã chạy. Lưu checkpoint trước khi chạy tool: resume chạy lại đúng toolu_1 với cùng khoá, phía nhận trả kết quả cũ, hoàn tiền 1 lần. Chỉ lưu sau khi chạy tool: resume gọi lại model, toolu_2 mang khoá mới, hoàn tiền 2 lần"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
--blue:#0969da;--blue-bg:#ddf4ff;--orange:#bc4c00;--orange-bg:#fff1e5;
--red:#cf222e;--red-bg:#ffebe9;--green:#1a7f37;--green-bg:#dafbe1}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;
--slot:#3d444d;--tok:#151b23;--blue:#4493f8;--blue-bg:#0c2d6b;--orange:#db6d28;--orange-bg:#3d1e00;
--red:#f85149;--red-bg:#490202;--green:#3fb950;--green-bg:#033a16}}
.bg{fill:var(--bg)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.title{font-size:20px;font-weight:600}
.row{font-size:15px;font-weight:600}
.sub{font-size:12px;fill:var(--muted)}
.cap{font-size:14px}
.cap2{font-size:13px;fill:var(--muted)}
.lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;text-anchor:middle}
.mid{text-anchor:middle}.end{text-anchor:end}
.slot{fill:none;stroke:var(--slot);stroke-width:1.5;stroke-dasharray:4 4}
.tok{fill:var(--tok);stroke:var(--slot);stroke-width:1.5}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:2}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:2}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:2}
.hatch{fill:url(#hatch);stroke:var(--red);stroke-width:2}
.fblue{fill:var(--blue)}.forange{fill:var(--orange)}.fred{fill:var(--red)}.ffg{fill:var(--fg)}
.tblue{fill:var(--blue)}.torange{fill:var(--orange)}.tred{fill:var(--red)}
.lblue{stroke:var(--blue);stroke-width:2;fill:none}
.lorange{stroke:var(--orange);stroke-width:2;fill:none}
.lred{stroke:var(--red);stroke-width:2;fill:none}
.lmuted{stroke:var(--slot);stroke-width:1.5;fill:none}
.lfg{stroke:var(--fg);stroke-width:1.5;fill:none}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.dash{stroke-dasharray:6 4}
.grid{stroke:var(--slot);stroke-width:1;opacity:.6}
.axis{stroke:var(--muted);stroke-width:1}
.static-only{opacity:0}
@media (prefers-reduced-motion: reduce){
.a-show,.a-hide{animation:none!important}.a-show{opacity:1}.a-hide{opacity:0}.static-only{opacity:1}}
@keyframes k1{0.0%{opacity:0} 3.33%{opacity:0} 4.67%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}@keyframes k2{0.0%{opacity:0} 13.33%{opacity:0} 14.67%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}@keyframes k3{0.0%{opacity:0} 23.33%{opacity:0} 24.67%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}@keyframes k4{0.0%{opacity:0} 33.33%{opacity:0} 34.67%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}@keyframes k5{0.0%{opacity:0} 43.33%{opacity:0} 44.67%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}@keyframes k6{0.0%{opacity:0} 53.33%{opacity:0} 54.67%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}@keyframes k7{0.0%{opacity:0} 63.33%{opacity:0} 64.67%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}</style><defs><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fblue" d="M0,0L10,5L0,10z"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="forange" d="M0,0L10,5L0,10z"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fred" d="M0,0L10,5L0,10z"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ffg" d="M0,0L10,5L0,10z"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--red-bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--red);stroke-width:2;opacity:.55"/></pattern></defs><rect class="bg" width="1112" height="462" rx="12"/><text class="title" x="20" y="38">Lưu checkpoint trước hay sau khi chạy tool</text><rect class="blue" x="732" y="27" width="14" height="14" rx="3"/><text class="sub" x="752" y="38">lấy từ checkpoint</text><rect class="hatch" x="895" y="27" width="14" height="14" rx="3"/><text class="sub" x="915" y="38">tác dụng phụ lặp lại</text><text class="cap2" x="20" y="64">Process chết sau khi refund đã hoàn tiền, trước khi lưu kết quả tool. Khoá = run id + tool_use id.</text><text class="row" x="20" y="156">Lưu trước tool</text><text class="sub" x="20" y="174">như vòng lặp §3.2</text><rect class="slot" x="176" y="132" width="142" height="54" rx="7"/><rect class="slot" x="330" y="132" width="142" height="54" rx="7"/><rect class="slot" x="484" y="132" width="142" height="54" rx="7"/><rect class="slot" x="792" y="132" width="142" height="54" rx="7"/><rect class="slot" x="946" y="132" width="142" height="54" rx="7"/><text class="row" x="20" y="304">Lưu sau tool</text><text class="sub" x="20" y="322">chỉ lưu khi có kết quả</text><rect class="slot" x="176" y="280" width="142" height="54" rx="7"/><rect class="slot" x="330" y="280" width="142" height="54" rx="7"/><rect class="slot" x="484" y="280" width="142" height="54" rx="7"/><rect class="slot" x="792" y="280" width="142" height="54" rx="7"/><rect class="slot" x="946" y="280" width="142" height="54" rx="7"/><g class="a-show" style="animation:k1 30.0s linear infinite"><rect class="tok" x="176" y="132" width="142" height="54" rx="7"/><text class="cap mid halo" x="247.0" y="154">model trả</text><text class="lbl halo" style="font-size:12px" x="247.0" y="174">tool_use toolu_1</text><rect class="tok" x="176" y="280" width="142" height="54" rx="7"/><text class="cap mid halo" x="247.0" y="302">model trả</text><text class="lbl halo" style="font-size:12px" x="247.0" y="322">tool_use toolu_1</text></g><g class="a-show" style="animation:k2 30.0s linear infinite"><rect class="blue" x="330" y="132" width="142" height="54" rx="7"/><text class="cap mid halo" x="401.0" y="154">lưu checkpoint</text><text class="lbl halo" style="font-size:12px" x="401.0" y="174">có toolu_1</text><text class="sub mid" x="401.0" y="312.0">chưa lưu</text></g><g class="a-show" style="animation:k3 30.0s linear infinite"><rect class="tok" x="484" y="132" width="142" height="54" rx="7"/><text class="cap mid halo" x="555.0" y="154">refund: hoàn tiền</text><text class="lbl halo" style="font-size:12px" x="555.0" y="174">r42:toolu_1</text><rect class="tok" x="484" y="280" width="142" height="54" rx="7"/><text class="cap mid halo" x="555.0" y="302">refund: hoàn tiền</text><text class="lbl halo" style="font-size:12px" x="555.0" y="322">r42:toolu_1</text></g><g class="a-show" style="animation:k4 30.0s linear infinite"><line class="lred dash" x1="709.0" y1="124" x2="709.0" y2="342"/><text class="cap mid tred" x="709.0" y="116">process chết</text></g><g class="a-show" style="animation:k5 30.0s linear infinite"><rect class="blue" x="792" y="132" width="142" height="54" rx="7"/><text class="cap mid halo" x="863.0" y="154">resume: chạy lại</text><text class="lbl halo" style="font-size:12px" x="863.0" y="174">toolu_1</text><rect class="tok" x="792" y="280" width="142" height="54" rx="7"/><text class="cap mid halo" x="863.0" y="302">resume: gọi model</text><text class="lbl halo" style="font-size:12px" x="863.0" y="322">tool_use toolu_2</text></g><g class="a-show" style="animation:k6 30.0s linear infinite"><rect class="blue" x="946" y="132" width="142" height="54" rx="7"/><text class="cap mid halo" x="1017.0" y="154">refund: khoá cũ</text><text class="lbl halo" style="font-size:12px" x="1017.0" y="174">r42:toolu_1</text><rect class="hatch" x="946" y="280" width="142" height="54" rx="7"/><text class="cap mid halo" x="1017.0" y="302">refund lần 2</text><text class="lbl halo" style="font-size:12px" x="1017.0" y="322">r42:toolu_2</text></g><g class="a-show" style="animation:k7 30.0s linear infinite"><text class="cap" x="176" y="214">Cùng khoá: phía nhận trả lại kết quả cũ. Hoàn tiền 1 lần.</text><text class="cap" x="176" y="362">Khoá mới: phía nhận coi là yêu cầu mới. Hoàn tiền 2 lần.</text></g><line class="axis" x1="176" y1="412" x2="1088" y2="412" marker-end="url(#afg)"/><text class="sub end" x="1088" y="430">thời gian</text><text class="cap2" x="20" y="448">Hàng trên chỉ an toàn khi phía nhận khử trùng theo khoá. Id rút gọn, run id giả định.</text></svg>
