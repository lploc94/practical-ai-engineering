<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 372" width="810" height="372" role="img" aria-label="Ví dụ trong docs Claude: 312 token suy luận sinh trước, 36 token câu trả lời sinh sau, gần 90% trong 348 output token là suy luận. Với max_tokens = 256 (giả định), request dừng với stop_reason max_tokens giữa lúc suy luận và không có chữ nào của câu trả lời"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
