 1</text><rect class="tok" x="498" y="116" width="46" height="36" rx="7"/><text class="lbl" style="font-size:13px" x="521.0" y="139.0">text</text><rect class="tok" x="549" y="116" width="62" height="36" rx="7"/><text class="lbl" style="font-size:13px" x="580.0" y="139.0">user 2</text><rect class="blue" x="616" y="116" width="94" height="36" rx="7"/><text class="lbl" style="font-size:13px" x="663.0" y="139.0">thinking 2</text><rect class="tok" x="715" y="116" width="46" height="36" rx="7"/><text class="lbl" style="font-size:13px" x="738.0" y="139.0">text</text><rect class="tok" style="stroke-width:2.5" x="766" y="116" width="62" height="36" rx="7"/><text class="lbl" style="font-size:13px" x="797.0" y="139.0">user 3</text><text class="sub mid" style="fill:var(--fg)" x="797.0" y="107">+ mới</text><text class="row" x="20" y="237">Sửa user 2</text><rect class="tok" x="196" y="214" width="68" height="36" rx="7"/><text class="lbl" style="font-size:13px" x="230.0" y="237.0">system</text><rect class="tok" x="269" y="214" width="58" height="36" rx="7"/><text class="lbl" style="font-size:13px" x="298.0" y="237.0">tools</text><rect class="tok" x="332" y="214" width="62" height="36" rx="7"/><text class="lbl" style="font-size:13px" x="363.0" y="237.0">user 1</text><rect class="blue" x="399" y="214" width="94" height="36" rx="7"/><text class="lbl" style="font-size:13px" x="446.0" y="237.0">thinking 1</text><rect class="tok" x="498" y="214" width="46" height="36" rx="7"/><text class="lbl" style="font-size:13px" x="521.0" y="237.0">text</text><rect class="tok" x="549" y="214" width="62" height="36" rx="7"/><text class="lbl" style="font-size:13px" x="580.0" y="237.0">user 2</text><rect class="lfg" style="stroke-width:3" x="546" y="211" width="68" height="42" rx="9"/><text class="sub mid" style="fill:var(--fg)" x="580.0" y="205">sửa</text><rect class="hatch" x="616" y="214" width="94" height="36" rx="7"/><text class="lbl halo" style="font-size:13px" x="663.0" y="237.0">thinking 2</text><rect class="tok" x="715" y="214" width="46" height="36" rx="7"/><text class="lbl" style="font-size:13px" x="738.0" y="237.0">text</text><rect class="tok" x="766" y="214" width="62" height="36" rx="7"/><text class="lbl" style="font-size:13px" x="797.0" y="237.0">user 3</text><text class="row" x="20" y="335">Sửa system</text><rect class="tok" x="196" y="312" width="68" height="36" rx="7"/><text class="lbl" style="font-size:13px" x="230.0" y="335.0">system</text><rect class="lfg" style="stroke-width:3" x="193" y="309" width="74" height="42" rx="9"/><text class="sub mid" style="fill:var(--fg)" x="230.0" y="303">sửa</text><rect class="tok" x="269" y="312" width="58" height="36" rx="7"/><text class="lbl" style="font-size:13px" x="298.0" y="335.0">tools</text><rect class="tok" x="332" y="312" width="62" height="36" rx="7"/><text class="lbl" style="font-size:13px" x="363.0" y="335.0">user 1</text><rect class="hatch" x="399" y="312" width="94" height="36" rx="7"/><text class="lbl halo" style="font-size:13px" x="446.0" y="335.0">thinking 1</text><rect class="tok" x="498" y="312" width="46" height="36" rx="7"/><text class="lbl" style="font-size:13px" x="521.0" y="335.0">text</text><rect class="tok" x="549" y="312" width="62" height="36" rx="7"/><text class="lbl" style="font-size:13px" x="580.0" y="335.0">user 2</text><rect class="hatch" x="616" y="312" width="94" height="36" rx="7"/><text class="lbl halo" style="font-size:13px" x="663.0" y="335.0">thinking 2</text><rect class="tok" x="715" y="312" width="46" height="36" rx="7"/><text class="lbl" style="font-size:13px" x="738.0" y="335.0">text</text><rect class="tok" x="766" y="312" width="62" height="36" rx="7"/><text class="lbl" style="font-size:13px" x="797.0" y="335.0">user 3</text><text class="cap" x="196" y="176">Prefix của mọi thinking block giữ nguyên: cả hai còn hợp lệ.</text><text class="cap" x="196" y="274">Thinking 1 sinh trước user 2 nên không bị ảnh hưởng; thinking 2 mất hiệu lực.</text><text class="cap" x="196" y="372">System nằm trong prefix của mọi block: cả hai thinking mất hiệu lực.</text><text class="cap2" x="20" y="394">Request thường không đặt prefix_mismatch_behavior: tuỳ model, API trả 400,</text><text class="cap2" x="20" y="414">hoặc không báo lỗi mà vẫn gửi block mất hiệu lực tới model và tính tiền.</text></svg>
