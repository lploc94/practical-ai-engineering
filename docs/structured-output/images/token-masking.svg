ot; = 0,06, &quot; 5&quot; = 0,03, bỏ qua phần còn lại của vocabulary; engine không cho khoảng trắng sau số.</text><g class="static-only"><text class="title" x="20" y="40">Constrained decoding: che token rồi mới sample</text><text class="cap" x="20" y="396">Token mở chuỗi bị che; &quot; 4&quot; từ 0,38 lên 0,81 và được chọn; sau đó engine ghi luôn }.</text></g></svg>
