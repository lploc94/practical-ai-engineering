class="lbl" x="467.0" y="135.0">, &quot;reasoning&quot;:</text></g><g ><rect class="tok" x="540" y="112" width="170" height="36" rx="7"/><text class="lbl" x="625.0" y="135.0">&quot;3 hộp × 4 quả…&quot;</text></g><g ><rect class="tok" x="718" y="112" width="32" height="36" rx="7"/><text class="lbl" x="734.0" y="135.0">}</text></g><text class="cap" x="150" y="178">đáp án được chọn khi mới có prompt; lập luận sinh sau không đổi được đáp án</text><text class="row" x="20" y="241">Lập luận trước</text><rect class="blue" style="fill-opacity:.5" x="144" y="212" width="508.0" height="48" rx="10"/><g ><rect class="tok" x="150" y="218" width="80" height="36" rx="7"/><text class="lbl" x="190.0" y="241.0">prompt</text></g><g ><rect class="tok" x="238" y="218" width="122" height="36" rx="7"/><text class="lbl" x="299.0" y="241.0">{&quot;reasoning&quot;:</text></g><g ><rect class="tok" x="368" y="218" width="170" height="36" rx="7"/><text class="lbl" x="453.0" y="241.0">&quot;3 hộp × 4 quả…&quot;</text></g><g ><rect class="tok" x="546" y="218" width="104" height="36" rx="7"/><text class="lbl" x="598.0" y="241.0">, &quot;answer&quot;:</text></g><g ><rect class="orange" x="658" y="218" width="44" height="36" rx="7"/><text class="lbl" x="680.0" y="241.0">12</text></g><g ><rect class="tok" x="710" y="218" width="32" height="36" rx="7"/><text class="lbl" x="726.0" y="241.0">}</text></g><text class="cap" x="150" y="284">đáp án được chọn sau khi lập luận đã nằm trong ngữ cảnh</text><text class="cap2" x="20" y="320">Thứ tự key thực tế tuỳ provider (§2.1). Reasoning model có thinking nằm ngoài vùng bị ràng buộc nên không cần cách này.</text></svg>
