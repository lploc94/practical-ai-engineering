<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 372" width="820" height="372" role="img" aria-label="Cùng một câu hỏi chọn đội: LLM prefill rồi decode tuần tự 5 token để viết chuỗi returns, không có xác suất; decision model chỉ prefill rồi chấm cả ba option một lượt: shipping 0.04, billing 0.35, returns 0.61"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
--blue:#0969da;--blue-bg:#ddf4ff;--orange:#bc4c00;--orange-bg:#fff1e5;
--red:#cf222e;--red-bg:#ffebe9;--green:#1a7f37;--green-bg:#dafbe1}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;
--slot:#3d444d;--tok:#151b23;--blue:#4493f8;--blue-bg:#0c2d6b;--orange:#db6d28;--orange-bg:#3d1e00;
--red:#f85149;--red-bg:#490202;--green:#3fb950;--green-bg:#033a16}}
.bg{fill:var(--bg)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.title{font-size:20px;font-weight:600}
.row{font-size:15px;font-weight:600}
.sub{font-size:12px;fill:var(--muted)}
.cap{font-size:14px}
.cap2{font-size:13px;fill:var(--muted)}
.lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;text-anchor:middle}
.mid{text-anchor:middle}.end{text-anchor:end}
.slot{fill:none;stroke:var(--slot);stroke-width:1.5;stroke-dasharray:4 4}
.tok{fill:var(--tok);stroke:var(--slot);stroke-width:1.5}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:2}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:2}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:2}
.hatch{fill:url(#hatch);stroke:var(--red);stroke-width:2}
.fblue{fill:var(--blue)}.forange{fill:var(--orange)}.fred{fill:var(--red)}.ffg{fill:var(--fg)}
.tblue{fill:var(--blue)}.torange{fill:var(--orange)}.tred{fill:var(--red)}
.lblue{stroke:var(--blue);stroke-width:2;fill:none}
.lorange{stroke:var(--orange);stroke-width:2;fill:none}
.lred{stroke:var(--red);stroke-width:2;fill:none}
.lmuted{stroke:var(--slot);stroke-width:1.5;fill:none}
.lfg{stroke:var(--fg);stroke-width:1.5;fill:none}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.dash{stroke-dasharray:6 4}
.grid{stroke:var(--slot);stroke-width:1;opacity:.6}
.axis{stroke:var(--muted);stroke-width:1}
.static-only{opacity:0}
@media (prefers-reduced-motion: reduce){
.a-show,.a-hide{animation:none!important}.a-show{opacity:1}.a-hide{opacity:0}.static-only{opacity:1}}
@keyframes k1{0.0%{opacity:0} 6%{opacity:0} 8%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}@keyframes k2{0.0%{opacity:0} 6%{opacity:0} 8%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}@keyframes k3{0.0%{opacity:0} 20%{opacity:0} 22%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}@keyframes k4{0.0%{opacity:0} 28%{opacity:0} 30%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}@keyframes k5{0.0%{opacity:0} 36%{opacity:0} 38%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}@keyframes k6{0.0%{opacity:0} 44%{opacity:0} 46%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}@keyframes k7{0.0%{opacity:0} 52%{opacity:0} 54%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}@keyframes k8{0.0%{opacity:0} 60%{opacity:0} 62%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}@keyframes k9{0.0%{opacity:0} 20%{opacity:0} 22%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}@keyframes k10{0.0%{opacity:0} 28%{opacity:0} 30%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}</style><defs><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fblue" d="M0,0L10,5L0,10z"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="forange" d="M0,0L10,5L0,10z"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fred" d="M0,0L10,5L0,10z"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ffg" d="M0,0L10,5L0,10z"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--red-bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--red);stroke-width:2;opacity:.55"/></pattern></defs><rect class="bg" width="820" height="372" rx="12"/><style>.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}.fmuted{fill:var(--muted)}</style><text class="title" x="20" y="38">LLM viết từng token; decision model chấm mọi option một lượt</text><text class="cap2" x="20" y="62">Cùng state, cùng câu hỏi department. Hai hàng chạy cùng một đồng hồ; độ dài khối chỉ minh hoạ thứ tự.</text><rect class="blue" x="520" y="81" width="14" height="14" rx="3"/><text class="sub" x="540" y="92">prefill</text><rect class="orange" x="613" y="81" width="14" height="14" rx="3"/><text class="sub" x="633" y="92">token sinh ra</text><text class="row" x="20" y="126">LLM</text><text class="sub" x="20" y="143">structured output</text><text class="row" x="20" y="254">Decision model</text><text class="sub" x="20" y="271">chỉ prefill</text><rect class="slot" x="196" y="108" width="110" height="40" rx="7"/><g class="a-show" style="animation:k1 16s linear infinite"><rect class="blue" x="196" y="108" width="110" height="40" rx="7"/><text class="lbl" x="251.0" y="133.0">prefill</text></g><rect class="slot" x="196" y="236" width="110" height="40" rx="7"/><g class="a-show" style="animation:k2 16s linear infinite"><rect class="blue" x="196" y="236" width="110" height="40" rx="7"/><text class="lbl" x="251.0" y="261.0">prefill</text></g><rect class="slot" x="322" y="108" width="30" height="40" rx="7"/><g class="a-show" style="animation:k3 16s linear infinite"><rect class="orange" x="322" y="108" width="30" height="40" rx="7"/><text class="code mid" x="337.0" y="133.0">{</text></g><rect class="slot" x="358" y="108" width="124" height="40" rx="7"/><g class="a-show" style="animation:k4 16s linear infinite"><rect class="orange" x="358" y="108" width="124" height="40" rx="7"/><text class="code mid" x="420.0" y="133.0">"department"</text></g><rect class="slot" x="488" y="108" width="30" height="40" rx="7"/><g class="a-show" style="animation:k5 16s linear infinite"><rect class="orange" x="488" y="108" width="30" height="40" rx="7"/><text class="code mid" x="503.0" y="133.0">:</text></g><rect class="slot" x="524" y="108" width="100" height="40" rx="7"/><g class="a-show" style="animation:k6 16s linear infinite"><rect class="orange" x="524" y="108" width="100" height="40" rx="7"/><text class="code mid" x="574.0" y="133.0">"returns"</text></g><rect class="slot" x="630" y="108" width="30" height="40" rx="7"/><g class="a-show" style="animation:k7 16s linear infinite"><rect class="orange" x="630" y="108" width="30" height="40" rx="7"/><text class="code mid" x="645.0" y="133.0">}</text></g><g class="a-show" style="animation:k8 16s linear infinite"><text class="cap" x="196" y="174">5 bước decode tuần tự; kết quả là chuỗi "returns", không kèm xác suất.</text></g><g class="a-show" style="animation:k9 16s linear infinite"><text class="code end" x="402" y="238">shipping</text><rect class="fmuted" x="412" y="224" width="10.4" height="18" rx="3"/><text class="sub" x="430.4" y="238">0.04</text><text class="code end" x="402" y="264">billing</text><rect class="fmuted" x="412" y="250" width="91.0" height="18" rx="3"/><text class="sub" x="511.0" y="264">0.35</text><text class="code end" x="402" y="290">returns</text><rect class="fmuted" x="412" y="276" width="158.6" height="18" rx="3"/><text class="sub" x="578.6" y="290">0.61</text></g><g class="a-show" style="animation:k10 16s linear infinite"><text class="cap" x="196" y="330">0 token sinh ra; trả phân phối trên đúng các option bạn đưa.</text></g></svg>
