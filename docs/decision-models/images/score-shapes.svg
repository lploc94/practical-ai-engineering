<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-label="Ba phân phối trên thang ba mức: dồn vào mức 1 cho score 1.0 và confidence 1.0; chia đôi hai đầu thang cũng cho score 1.0 nhưng confidence 0; chia đôi hai mức kề cho score 1.5 và confidence 0.25"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
--blue:#0969da;--blue-bg:#ddf4ff;--orange:#bc4c00;--orange-bg:#fff1e5;
--red:#cf222e;--red-bg:#ffebe9;--green:#1a7f37;--green-bg:#dafbe1}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;
--slot:#3d444d;--tok:#151b23;--blue:#4493f8;--blue-bg:#0c2d6b;--orange:#db6d28;--orange-bg:#3d1e00;
--red:#f85149;--red-bg:#490202;--green:#3fb950;--green-bg:#033a16}}
.bg{fill:var(--bg)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.title{font-size:20px;font-weight:600}
.row{font-size:15px;font-weight:600}
.sub{font-size:12px;fill:var(--muted)}
.cap{font-size:14px}
.cap2{font-size:13px;fill:var(--muted)}
.lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;text-anchor:middle}
.mid{text-anchor:middle}.end{text-anchor:end}
.slot{fill:none;stroke:var(--slot);stroke-width:1.5;stroke-dasharray:4 4}
.tok{fill:var(--tok);stroke:var(--slot);stroke-width:1.5}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:2}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:2}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:2}
.hatch{fill:url(#hatch);stroke:var(--red);stroke-width:2}
.fblue{fill:var(--blue)}.forange{fill:var(--orange)}.fred{fill:var(--red)}.ffg{fill:var(--fg)}
.tblue{fill:var(--blue)}.torange{fill:var(--orange)}.tred{fill:var(--red)}
.lblue{stroke:var(--blue);stroke-width:2;fill:none}
.lorange{stroke:var(--orange);stroke-width:2;fill:none}
.lred{stroke:var(--red);stroke-width:2;fill:none}
.lmuted{stroke:var(--slot);stroke-width:1.5;fill:none}
.lfg{stroke:var(--fg);stroke-width:1.5;fill:none}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.dash{stroke-dasharray:6 4}
.grid{stroke:var(--slot);stroke-width:1;opacity:.6}
.axis{stroke:var(--muted);stroke-width:1}
.static-only{opacity:0}
@media (prefers-reduced-motion: reduce){
.a-show,.a-hide{animation:none!important}.a-show{opacity:1}.a-hide{opacity:0}.static-only{opacity:1}}
</style><defs><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fblue" d="M0,0L10,5L0,10z"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="forange" d="M0,0L10,5L0,10z"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fred" d="M0,0L10,5L0,10z"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ffg" d="M0,0L10,5L0,10z"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--red-bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--red);stroke-width:2;opacity:.55"/></pattern></defs><rect class="bg" width="820" height="400" rx="12"/><text class="title" x="20" y="38">Cùng score, khác hình dạng phân phối</text><text class="cap2" x="20" y="62">Câu Score ba mức (0, 1, 2). Score là trung bình có trọng số của số thứ tự mức; confidence đo độ tập trung.</text><rect class="fblue" x="20" y="81" width="14" height="14" rx="3"/><text class="sub" x="40" y="92">xác suất của mức</text><rect class="ffg" x="176" y="81" width="14" height="14" rx="3"/><text class="sub" x="196" y="92">vị trí score</text><text class="row" x="60" y="128">Dồn vào mức 1</text><line class="grid" x1="60" y1="226.0" x2="280" y2="226.0"/><line class="grid" x1="60" y1="162.0" x2="280" y2="162.0"/><text class="sub end" x="54" y="294">0</text><text class="sub end" x="54" y="230.0">0.5</text><text class="sub end" x="54" y="166.0">1.0</text><text class="sub mid" x="96.66666666666666" y="308">mức 0</text><rect class="fblue" x="144.0" y="162.0" width="52" height="128.0" rx="3"/><text class="sub mid halo" x="170.0" y="156.0">1.0</text><text class="sub mid" x="170.0" y="308">mức 1</text><text class="sub mid" x="243.33333333333331" y="308">mức 2</text><line class="axis" x1="60" y1="290" x2="280" y2="290"/><path class="ffg" d="M170.0,316 l-7,12 h14 z"/><text class="cap" x="60" y="356">score 1.0 · confidence 1.0</text><text class="row" x="316" y="128">Chia hai đầu thang</text><line class="grid" x1="316" y1="226.0" x2="536" y2="226.0"/><line class="grid" x1="316" y1="162.0" x2="536" y2="162.0"/><rect class="fblue" x="326.6666666666667" y="226.0" width="52" height="64.0" rx="3"/><text class="sub mid halo" x="352.6666666666667" y="220.0">0.5</text><text class="sub mid" x="352.6666666666667" y="308">mức 0</text><text class="sub mid" x="426.0" y="308">mức 1</text><rect class="fblue" x="473.3333333333333" y="226.0" width="52" height="64.0" rx="3"/><text class="sub mid halo" x="499.3333333333333" y="220.0">0.5</text><text class="sub mid" x="499.3333333333333" y="308">mức 2</text><line class="axis" x1="316" y1="290" x2="536" y2="290"/><path class="ffg" d="M426.0,316 l-7,12 h14 z"/><text class="cap" x="316" y="356">score 1.0 · confidence 0</text><text class="row" x="572" y="128">Chia hai mức kề</text><line class="grid" x1="572" y1="226.0" x2="792" y2="226.0"/><line class="grid" x1="572" y1="162.0" x2="792" y2="162.0"/><text class="sub mid" x="608.6666666666666" y="308">mức 0</text><rect class="fblue" x="656.0" y="226.0" width="52" height="64.0" rx="3"/><text class="sub mid halo" x="682.0" y="220.0">0.5</text><text class="sub mid" x="682.0" y="308">mức 1</text><rect class="fblue" x="729.3333333333333" y="226.0" width="52" height="64.0" rx="3"/><text class="sub mid halo" x="755.3333333333333" y="220.0">0.5</text><text class="sub mid" x="755.3333333333333" y="308">mức 2</text><line class="axis" x1="572" y1="290" x2="792" y2="290"/><path class="ffg" d="M718.6666666666666,316 l-7,12 h14 z"/><text class="cap" x="572" y="356">score 1.5 · confidence 0.25</text><text class="cap2" x="20" y="386">Hai panel đầu cùng score 1.0: một bên chắc chắn, một bên phân vân giữa hai đầu thang.</text></svg>
