<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 384" width="930" height="384" role="img" aria-label="Dòng giờ đổi mỗi request đặt ở đầu system prompt làm chỉ dẫn, ví dụ, tài liệu tĩnh và dữ liệu phiên phía sau phải tính lại dù không đổi; đặt phần ổn định trước, ngày render một lần đầu phiên, thì chỉ retrieval và câu hỏi là phần mới"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
--blue:#0969da;--blue-bg:#ddf4ff;--orange:#bc4c00;--orange-bg:#fff1e5;
--red:#cf222e;--red-bg:#ffebe9;--green:#1a7f37;--green-bg:#dafbe1}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;
--slot:#3d444d;--tok:#151b23;--blue:#4493f8;--blue-bg:#0c2d6b;--orange:#db6d28;--orange-bg:#3d1e00;
--red:#f85149;--red-bg:#490202;--green:#3fb950;--green-bg:#033a16}}
.bg{fill:var(--bg)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.title{font-size:20px;font-weight:600}
.row{font-size:15px;font-weight:600}
.sub{font-size:12px;fill:var(--muted)}
.cap{font-size:14px}
.cap2{font-size:13px;fill:var(--muted)}
.lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;text-anchor:middle}
.mid{text-anchor:middle}.end{text-anchor:end}
.slot{fill:none;stroke:var(--slot);stroke-width:1.5;stroke-dasharray:4 4}
.tok{fill:var(--tok);stroke:var(--slot);stroke-width:1.5}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:2}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:2}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:2}
.hatch{fill:url(#hatch);stroke:var(--red);stroke-width:2}
.fblue{fill:var(--blue)}.forange{fill:var(--orange)}.fred{fill:var(--red)}.ffg{fill:var(--fg)}
.tblue{fill:var(--blue)}.torange{fill:var(--orange)}.tred{fill:var(--red)}
.lblue{stroke:var(--blue);stroke-width:2;fill:none}
.lorange{stroke:var(--orange);stroke-width:2;fill:none}
.lred{stroke:var(--red);stroke-width:2;fill:none}
.lmuted{stroke:var(--slot);stroke-width:1.5;fill:none}
.lfg{stroke:var(--fg);stroke-width:1.5;fill:none}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.dash{stroke-dasharray:6 4}
.grid{stroke:var(--slot);stroke-width:1;opacity:.6}
.axis{stroke:var(--muted);stroke-width:1}
.static-only{opacity:0}
@media (prefers-reduced-motion: reduce){
.a-show,.a-hide{animation:none!important}.a-show{opacity:1}.a-hide{opacity:0}.static-only{opacity:1}}
</style><defs><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fblue" d="M0,0L10,5L0,10z"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="forange" d="M0,0L10,5L0,10z"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fred" d="M0,0L10,5L0,10z"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ffg" d="M0,0L10,5L0,10z"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--red-bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--red);stroke-width:2;opacity:.55"/></pattern></defs><rect class="bg" width="930" height="384" rx="12"/><text class="title" x="20" y="38">Một dòng giờ ở đầu prompt làm mất cache phía sau</text><text class="cap2" x="20" y="62">Request thứ hai trong cùng một phiên, Claude: cache khớp theo prefix tools → system → messages.</text><rect class="blue" x="20" y="81" width="14" height="14" rx="3"/><text class="sub" x="40" y="92">đọc từ cache</text><rect class="hatch" x="148" y="81" width="14" height="14" rx="3"/><text class="sub" x="168" y="92">giống lần trước, vẫn phải tính lại</text><rect class="tok" x="430" y="81" width="14" height="14" rx="3"/><text class="sub" x="450" y="92">phần mới của request</text><text class="row" x="20" y="160">Giờ ở đầu</text><text class="sub" x="20" y="178">system prompt</text><rect class="blue" x="150" y="140" width="64" height="46" rx="7"/><text class="cap mid halo" x="182.0" y="168.0">tools</text><rect class="tok" x="220" y="140" width="112" height="46" rx="7"/><text class="cap mid halo" x="276.0" y="168.0">giờ 14:32:05</text><rect class="hatch" x="338" y="140" width="82" height="46" rx="7"/><text class="cap mid halo" x="379.0" y="168.0">chỉ dẫn</text><rect class="hatch" x="426" y="140" width="70" height="46" rx="7"/><text class="cap mid halo" x="461.0" y="168.0">ví dụ</text><rect class="hatch" x="502" y="140" width="112" height="46" rx="7"/><text class="cap mid halo" x="558.0" y="168.0">tài liệu tĩnh</text><rect class="hatch" x="620" y="140" width="104" height="46" rx="7"/><text class="cap mid halo" x="672.0" y="168.0">ngày, hồ sơ</text><rect class="tok" x="730" y="140" width="92" height="46" rx="7"/><text class="cap mid halo" x="776.0" y="168.0">retrieval</text><rect class="tok" x="828" y="140" width="82" height="46" rx="7"/><text class="cap mid halo" x="869.0" y="168.0">câu hỏi</text><text class="sub mid" x="276.0" y="130">đổi mỗi request</text><text class="cap" x="150" y="212">Byte khác đầu tiên là dòng giờ: các khối sọc không đổi một chữ nhưng vẫn phải tính lại.</text><text class="row" x="20" y="304">Ổn định trước</text><text class="sub" x="20" y="322">động sau</text><rect class="blue" x="150" y="284" width="64" height="46" rx="7"/><text class="cap mid halo" x="182.0" y="312.0">tools</text><rect class="blue" x="220" y="284" width="82" height="46" rx="7"/><text class="cap mid halo" x="261.0" y="312.0">chỉ dẫn</text><rect class="blue" x="308" y="284" width="70" height="46" rx="7"/><text class="cap mid halo" x="343.0" y="312.0">ví dụ</text><rect class="blue" x="384" y="284" width="112" height="46" rx="7"/><text class="cap mid halo" x="440.0" y="312.0">tài liệu tĩnh</text><rect class="blue" x="502" y="284" width="104" height="46" rx="7"/><text class="cap mid halo" x="554.0" y="312.0">ngày, hồ sơ</text><rect class="tok" x="612" y="284" width="92" height="46" rx="7"/><text class="cap mid halo" x="658.0" y="312.0">retrieval</text><rect class="tok" x="710" y="284" width="82" height="46" rx="7"/><text class="cap mid halo" x="751.0" y="312.0">câu hỏi</text><path class="lblue" d="M150,278 V272 H606 V278"/><text class="sub mid" x="378.0" y="266">prefix giống hệt request trước</text><text class="cap" x="150" y="356">Ngày render một lần lúc đầu phiên nên nằm trong prefix; chỉ retrieval và câu hỏi là mới.</text></svg>
