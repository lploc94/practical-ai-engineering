.0"/><rect class="fblue" x="111.6" y="100.0" width="9.6" height="200.0"/><rect class="fblue" x="123.3" y="164.0" width="9.6" height="136.0"/><rect class="fblue" x="134.9" y="220.0" width="9.6" height="80.0"/><rect class="fblue" x="146.5" y="252.0" width="9.6" height="48.0"/><rect class="fblue" x="158.1" y="272.0" width="9.6" height="28.0"/><rect class="fblue" x="169.7" y="288.0" width="9.6" height="12.0"/><rect class="fblue" x="181.3" y="292.0" width="9.6" height="8.0"/><rect class="hatch" x="762.0" y="284.0" width="9.6" height="16.0"/><line class="axis" x1="70" y1="300" x2="790" y2="300"/><text class="sub mid" x="81.6" y="318">1</text><text class="sub mid" x="186.1" y="318">10</text><text class="sub mid" x="302.3" y="318">20</text><text class="sub mid" x="418.4" y="318">30</text><text class="sub mid" x="534.5" y="318">40</text><text class="sub mid" x="650.6" y="318">50</text><text class="sub mid" x="766.8" y="318">60</text><text class="sub mid" x="430.0" y="338">gen_ai.invoke_agent.inference_calls (số lượt gọi model trong một run)</text><line class="lfg dash" x1="116.5" y1="92" x2="116.5" y2="300"/><text class="cap halo " x="124.5" y="104" style="font-weight:600">p50 = 4</text><line class="lfg dash" x1="766.8" y1="92" x2="766.8" y2="300"/><text class="cap halo end" x="758.8" y="104" style="font-weight:600">p99 = 60</text><text class="sub end halo" x="758.8" y="258.0">20 run chạm giới hạn</text><text class="sub end halo" x="758.8" y="274.0">60 lượt: đang chạy vòng</text><text class="cap2" x="20" y="368">Bỏ 2% run chạy vòng thì p50 vẫn là 4, p99 về 10; alert trên p99 và tỉ lệ run chạm giới hạn.</text></svg>
