<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 516" width="820" height="516" role="img" aria-label="Claude trả input_tokens 500, cache_read_input_tokens 9.000, cache_creation_input_tokens 500: ghi thẳng input_tokens làm cache hit rate thành 1.800%, cộng cả cache thì input 10.000 và hit rate 90%. Gemini trả candidatesTokenCount 400 và thoughtsTokenCount 1.600: ghi thẳng candidates bỏ sót phần thinking, chuẩn hoá thì output 2.000"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
--blue:#0969da;--blue-bg:#ddf4ff;--orange:#bc4c00;--orange-bg:#fff1e5;
--red:#cf222e;--red-bg:#ffebe9;--green:#1a7f37;--green-bg:#dafbe1}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;
--slot:#3d444d;--tok:#151b23;--blue:#4493f8;--blue-bg:#0c2d6b;--orange:#db6d28;--orange-bg:#3d1e00;
--red:#f85149;--red-bg:#490202;--green:#3fb950;--green-bg:#033a16}}
.bg{fill:var(--bg)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.title{font-size:20px;font-weight:600}
.row{font-size:15px;font-weight:600}
.sub{font-size:12px;fill:var(--muted)}
.cap{font-size:14px}
.cap2{font-size:13px;fill:var(--muted)}
.lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;text-anchor:middle}
.mid{text-anchor:middle}.end{text-anchor:end}
.slot{fill:none;stroke:var(--slot);stroke-width:1.5;stroke-dasharray:4 4}
.tok{fill:var(--tok);stroke:var(--slot);stroke-width:1.5}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:2}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:2}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:2}
.hatch{fill:url(#hatch);stroke:var(--red);stroke-width:2}
.fblue{fill:var(--blue)}.forange{fill:var(--orange)}.fred{fill:var(--red)}.ffg{fill:var(--fg)}
.tblue{fill:var(--blue)}.torange{fill:var(--orange)}.tred{fill:var(--red)}
.lblue{stroke:var(--blue);stroke-width:2;fill:none}
.lorange{stroke:var(--orange);stroke-width:2;fill:none}
.lred{stroke:var(--red);stroke-width:2;fill:none}
.lmuted{stroke:var(--slot);stroke-width:1.5;fill:none}
.lfg{stroke:var(--fg);stroke-width:1.5;fill:none}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.dash{stroke-dasharray:6 4}
.grid{stroke:var(--slot);stroke-width:1;opacity:.6}
.axis{stroke:var(--muted);stroke-width:1}
.static-only{opacity:0}
@media (prefers-reduced-motion: reduce){
.a-show,.a-hide{animation:none!important}.a-show{opacity:1}.a-hide{opacity:0}.static-only{opacity:1}}
</style><defs><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fblue" d="M0,0L10,5L0,10z"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="forange" d="M0,0L10,5L0,10z"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fred" d="M0,0L10,5L0,10z"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ffg" d="M0,0L10,5L0,10z"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--red-bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--red);stroke-width:2;opacity:.55"/></pattern></defs><rect class="bg" width="820" height="516" rx="12"/><text class="title" x="20" y="38">Chuẩn hoá token trước khi ghi vào gen_ai.usage.*</text><rect class="blue" x="20" y="55" width="14" height="14" rx="3"/><text class="sub" x="40" y="66">đọc từ cache</text><rect class="tok" x="148" y="55" width="14" height="14" rx="3"/><text class="sub" x="168" y="66">token khác</text><rect class="hatch" x="262" y="55" width="14" height="14" rx="3"/><text class="sub" x="282" y="66">ghi thẳng field của provider: sai</text><text class="cap" x="20" y="102" style="font-weight:600">Claude: input_tokens chỉ là phần sau cache breakpoint</text><text class="row" x="20" y="145">usage trả về</text><rect class="blue" x="200.0" y="126" width="529.0" height="28" rx="4"/><rect class="tok" x="731.0" y="126" width="27.5" height="28" rx="4"/><rect class="tok" x="760.5" y="126" width="29.5" height="28" rx="4"/><text class="lbl halo" x="465.5" y="145" style="font-size:13px">cache_read_input_tokens 9.000</text><text class="sub end" x="790" y="120" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">input_tokens 500</text><text class="sub end" x="758.5" y="169" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">cache_creation_input_tokens 500</text><text class="row" x="20" y="203">Ghi thẳng</text><text class="sub" x="20" y="219">input_tokens</text><rect class="hatch" x="760.5" y="184" width="29.5" height="28" rx="4"/><text class="cap end" x="750.5" y="203">input = 500 → cache hit rate 9.000 / 500 = <tspan style="font-weight:600">1.800%</tspan></text><text class="row" x="20" y="253">Chuẩn hoá</text><text class="sub" x="20" y="269">cộng cả cache</text><rect class="lfg" x="200" y="234" width="590" height="28" rx="4"/><text class="cap" x="210" y="253">input = 500 + 9.000 + 500 = 10.000 → cache hit rate <tspan style="font-weight:600">90%</tspan></text><text class="cap" x="20" y="314" style="font-weight:600">Gemini: candidatesTokenCount không gồm thinking</text><text class="row" x="20" y="357">usage trả về</text><rect class="tok" x="200.0" y="338" width="116.0" height="28" rx="4"/><rect class="tok" x="318.0" y="338" width="472.0" height="28" rx="4"/><text class="lbl" x="259.0" y="357" style="font-size:13px">candidates 400</text><text class="lbl" x="554.0" y="357" style="font-size:13px">thoughtsTokenCount 1.600</text><text class="row" x="20" y="403">Ghi thẳng</text><text class="sub" x="20" y="419">candidatesTokenCount</text><rect class="hatch" x="200.0" y="384" width="118.0" height="28" rx="4"/><text class="cap" x="328.0" y="403">output = 400 → bỏ sót 1.600 token thinking vẫn bị tính tiền</text><text class="row" x="20" y="453">Chuẩn hoá</text><text class="sub" x="20" y="469">cộng thoughts</text><rect class="lfg" x="200" y="434" width="590" height="28" rx="4"/><text class="cap" x="210" y="453">output = 400 + 1.600 = 2.000</text><text class="cap2" x="20" y="504">Số token giả định cho một request. Mỗi panel có thang riêng.</text></svg>
