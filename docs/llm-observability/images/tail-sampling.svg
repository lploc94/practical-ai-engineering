"0" y1="0" x2="0" y2="7" style="stroke:var(--red);stroke-width:2;opacity:.55"/></pattern></defs><rect class="bg" width="820" height="426" rx="12"/><text class="title" x="20" y="38">Tail sampling quyết định sau decision_wait, feedback đến còn muộn hơn</text><rect class="blue" x="20" y="55" width="14" height="14" rx="3"/><text class="sub" x="40" y="66">span đã tới Collector</text><rect class="slot" x="211" y="55" width="14" height="14" rx="3"/><text class="sub" x="231" y="66">chờ quyết định</text><rect class="hatch" x="353" y="55" width="14" height="14" rx="3"/><text class="sub" x="373" y="66">đến sau quyết định</text><line class="axis" x1="190" y1="352" x2="640" y2="352"/><line class="axis" x1="190.0" y1="352" x2="190.0" y2="357"/><text class="sub mid" x="190.0" y="370">0 s</text><line class="axis" x1="254.3" y1="352" x2="254.3" y2="357"/><text class="sub mid" x="254.3" y="370">6 s</text><line class="axis" x1="318.6" y1="352" x2="318.6" y2="357"/><text class="sub mid" x="318.6" y="370">12 s</text><line class="axis" x1="382.9" y1="352" x2="382.9" y2="357"/><text class="sub mid" x="382.9" y="370">18 s</text><line class="axis" x1="447.1" y1="352" x2="447.1" y2="357"/><text class="sub mid" x="447.1" y="370">24 s</text><line class="axis" x1="511.4" y1="352" x2="511.4" y2="357"/><text class="sub mid" x="511.4" y="370">30 s</text><line class="axis" x1="575.7" y1="352" x2="575.7" y2="357"/><text class="sub mid" x="575.7" y="370">36 s</text><line class="axis" x1="640.0" y1="352" x2="640.0" y2="357"/><text class="sub mid" x="640.0" y="370">42 s</text><line class="axis dash" x1="646" y1="352" x2="674" y2="352"/><line class="axis" x1="680" y1="352" x2="800" y2="352"/><text class="sub mid" x="740.0" y="370">vài giờ sau</text><text class="row" x="20" y="154">Trace A</text><text class="sub" x="20" y="171">có lượt bị cắt</text><text class="row" x="20" y="280">Trace B</text><text class="sub" x="20" y="297">lượt bình thường</text><g class="a-show" style="animation:k1 28.5s linear infinite"><path class="ffg" d="M184.0,122 l6,-6 l6,6 l-6,6z"/></g><g class="a-show" style="animation:k2 28.5s linear infinite"><text class="sub" x="202.0" y="126">head sampling quyết định ở ô thoi, khi chưa có span nào</text></g><g class="a-show" style="animation:k3 28.5s linear infinite"><path class="ffg" d="M216.1,248 l6,-6 l6,6 l-6,6z"/></g><g class="a-show" style="animation:k4 28.5s linear infinite"><rect class="slot" x="243.6" y="134" width="321.4" height="42" rx="6"/><rect class="blue" x="191.0" y="140" width="51.6" height="30" rx="4"/><text class="lbl" style="font-size:12px" x="216.8" y="159">chat</text></g><g class="a-show" style="animation:k5 28.5s linear infinite"><text class="sub end" x="557.0" y="166">decision_wait 30 s</text></g><g class="a-show" style="animation:k6 28.5s linear infinite"><rect class="blue" x="244.6" y="140" width="40.9" height="30" rx="4"/><text class="lbl" style="font-size:12px" x="265.0" y="159">tool</text></g><g class="a-show" style="animation:k7 28.5s linear infinite"><rect class="slot" x="297.1" y="260" width="321.4" height="42" rx="6"/><rect class="blue" x="223.1" y="266" width="73.0" height="30" rx="4"/><text class="lbl" style="font-size:12px" x="259.6" y="285">chat</text></g><g class="a-show" style="animation:k8 28.5s linear infinite"><rect class="blue" x="287.4" y="140" width="51.6" height="30" rx="4"/><text class="lbl" style="font-size:12px" x="313.2" y="159">chat</text></g><g class="a-show" style="animation:k9 28.5s linear infinite"><text class="sub" x="286.4" y="194" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">max_tokens → app.llm.keep</text></g><g class="a-show" style="animation:k10 28.5s linear infinite"><line class="lfg" x1="565.0" y1="128" x2="565.0" y2="182" style="stroke-width:3"/><text class="cap" x="573.0" y="152" style="font-weight:600">giữ</text><text class="sub" x="573.0" y="168">giây 35</text></g><g class="a-show" style="animation:k11 28.5s linear infinite"><line class="lfg" x1="618.6" y1="254" x2="618.6" y2="308" style="stroke-width:3"/><text class="cap" x="626.6" y="278" style="font-weight:600">bỏ</text><text class="sub" x="626.6" y="294">giây 40</text><text class="sub end" x="610.6" y="320">không có cờ, rơi ngoài mẫu 5%</text></g><g class="a-show" style="animation:k12 28.5s linear infinite"><rect class="hatch" x="680" y="266" width="120" height="30" rx="4"/><text class="cap halo mid" x="740.0" y="286" style="font-weight:600">thumbs down</text><text class="sub" x="680" y="314">trace đã bị bỏ</text><text class="sub" x="680" y="330">từ giây 40</text></g><text class="cap2" x="20" y="396">Collector chờ decision_wait kể từ khi nhận span đầu tiên. Muốn đọc trace có feedback tiêu cực,</text><text class="cap2" x="20" y="414">phải lưu ngắn hạn 100% request rồi chuyển bản ghi sang vùng lưu dài. Thời lượng span là giả định.</text></svg>
