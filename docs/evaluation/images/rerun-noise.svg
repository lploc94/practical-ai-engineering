<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" role="img" aria-label="Trên 200 câu, model cũ đạt 86% rồi 83% khi chạy lại, model mới 84%; khoảng tin cậy 95% rộng khoảng ±5 điểm nên ba khoảng chồng lên nhau và chênh 2 điểm giữa hai model nằm trong nhiễu (số liệu giả định)"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
--blue:#0969da;--blue-bg:#ddf4ff;--orange:#bc4c00;--orange-bg:#fff1e5;
--red:#cf222e;--red-bg:#ffebe9;--green:#1a7f37;--green-bg:#dafbe1}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;
--slot:#3d444d;--tok:#151b23;--blue:#4493f8;--blue-bg:#0c2d6b;--orange:#db6d28;--orange-bg:#3d1e00;
--red:#f85149;--red-bg:#490202;--green:#3fb950;--green-bg:#033a16}}
.bg{fill:var(--bg)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.title{font-size:20px;font-weight:600}
.row{font-size:15px;font-weight:600}
.sub{font-size:12px;fill:var(--muted)}
.cap{font-size:14px}
.cap2{font-size:13px;fill:var(--muted)}
.lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;text-anchor:middle}
.mid{text-anchor:middle}.end{text-anchor:end}
.slot{fill:none;stroke:var(--slot);stroke-width:1.5;stroke-dasharray:4 4}
.tok{fill:var(--tok);stroke:var(--slot);stroke-width:1.5}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:2}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:2}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:2}
.hatch{fill:url(#hatch);stroke:var(--red);stroke-width:2}
.fblue{fill:var(--blue)}.forange{fill:var(--orange)}.fred{fill:var(--red)}.ffg{fill:var(--fg)}
.tblue{fill:var(--blue)}.torange{fill:var(--orange)}.tred{fill:var(--red)}
.lblue{stroke:var(--blue);stroke-width:2;fill:none}
.lorange{stroke:var(--orange);stroke-width:2;fill:none}
.lred{stroke:var(--red);stroke-width:2;fill:none}
.lmuted{stroke:var(--slot);stroke-width:1.5;fill:none}
.lfg{stroke:var(--fg);stroke-width:1.5;fill:none}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.dash{stroke-dasharray:6 4}
.grid{stroke:var(--slot);stroke-width:1;opacity:.6}
.axis{stroke:var(--muted);stroke-width:1}
.static-only{opacity:0}
@media (prefers-reduced-motion: reduce){
.a-show,.a-hide{animation:none!important}.a-show{opacity:1}.a-hide{opacity:0}.static-only{opacity:1}}
</style><defs><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fblue" d="M0,0L10,5L0,10z"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="forange" d="M0,0L10,5L0,10z"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fred" d="M0,0L10,5L0,10z"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ffg" d="M0,0L10,5L0,10z"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--red-bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--red);stroke-width:2;opacity:.55"/></pattern></defs><rect class="bg" width="820" height="340" rx="12"/><text class="title" x="20" y="38">Cùng bộ 200 câu, ba lần chạy: chênh 2 điểm nằm trong nhiễu</text><text class="cap2" x="20" y="62">Số liệu giả định từ tình huống đầu bài. Vạch ngang: khoảng tin cậy 95%.</text><rect class="blue" x="20" y="81" width="14" height="14" rx="3"/><text class="sub" x="40" y="92">model cũ</text><rect class="orange" x="120" y="81" width="14" height="14" rx="3"/><text class="sub" x="140" y="92">model mới</text><line class="grid" x1="230.0" y1="112" x2="230.0" y2="262"/><text class="sub mid" x="230.0" y="280">76%</text><line class="grid" x1="370.0" y1="112" x2="370.0" y2="262"/><text class="sub mid" x="370.0" y="280">80%</text><line class="grid" x1="510.0" y1="112" x2="510.0" y2="262"/><text class="sub mid" x="510.0" y="280">84%</text><line class="grid" x1="650.0" y1="112" x2="650.0" y2="262"/><text class="sub mid" x="650.0" y="280">88%</text><line class="grid" x1="790.0" y1="112" x2="790.0" y2="262"/><text class="sub mid" x="790.0" y="280">92%</text><text class="sub mid" x="510.0" y="300">Pass rate trên 200 câu</text><text class="row" x="20" y="145">Model cũ, lần 1</text><line class="lblue" x1="411.7" y1="140" x2="748.3" y2="140" style="stroke-width:3"/><line class="lblue" x1="411.7" y1="132" x2="411.7" y2="148" style="stroke-width:3"/><line class="lblue" x1="748.3" y1="132" x2="748.3" y2="148" style="stroke-width:3"/><circle class="blue" cx="580.0" cy="140" r="7"/><text class="cap mid halo" x="580.0" y="127">86% ± 4,8</text><text class="row" x="20" y="193">Model cũ, lần 2</text><line class="lblue" x1="292.8" y1="188" x2="657.2" y2="188" style="stroke-width:3"/><line class="lblue" x1="292.8" y1="180" x2="292.8" y2="196" style="stroke-width:3"/><line class="lblue" x1="657.2" y1="180" x2="657.2" y2="196" style="stroke-width:3"/><circle class="blue" cx="475.0" cy="188" r="7"/><text class="cap mid halo" x="475.0" y="175">83% ± 5,2</text><text class="row" x="20" y="241">Model mới</text><line class="lorange" x1="332.2" y1="236" x2="687.8" y2="236" style="stroke-width:3"/><line class="lorange" x1="332.2" y1="228" x2="332.2" y2="244" style="stroke-width:3"/><line class="lorange" x1="687.8" y1="228" x2="687.8" y2="244" style="stroke-width:3"/><circle class="orange" cx="510.0" cy="236" r="7"/><text class="cap mid halo" x="510.0" y="223">84% ± 5,1</text><text class="cap2" x="20" y="328">Ba khoảng chồng lên nhau gần hết. Hai lần chạy cùng model đã lệch 3 điểm, hơn cả 2 điểm giữa hai model.</text></svg>
