"sub mid" x="80.0" y="338">1</text><text class="sub mid" x="164.28571428571428" y="338">2</text><text class="sub mid" x="248.57142857142856" y="338">3</text><text class="sub mid" x="332.85714285714283" y="338">4</text><text class="sub mid" x="417.1428571428571" y="338">5</text><text class="sub mid" x="501.42857142857144" y="338">6</text><text class="sub mid" x="585.7142857142857" y="338">7</text><text class="sub mid" x="670.0" y="338">8</text><text class="sub mid" x="375.0" y="358">k (số lần thử)</text><polyline class="lblue" points="80.0,122.0 164.3,102.2 248.6,100.2 332.9,100.0 417.1,100.0 501.4,100.0 585.7,100.0 670.0,100.0" style="stroke-width:2.5"/><circle class="fblue" cx="80.0" cy="122.0" r="4"/><circle class="fblue" cx="164.3" cy="102.2" r="4"/><circle class="fblue" cx="248.6" cy="100.2" r="4"/><circle class="fblue" cx="332.9" cy="100.0" r="4"/><circle class="fblue" cx="417.1" cy="100.0" r="4"/><circle class="fblue" cx="501.4" cy="100.0" r="4"/><circle class="fblue" cx="585.7" cy="100.0" r="4"/><circle class="fblue" cx="670.0" cy="100.0" r="4"/><polyline class="lorange" points="80.0,122.0 164.3,141.8 248.6,159.6 332.9,175.7 417.1,190.1 501.4,203.1 585.7,214.8 670.0,225.3" style="stroke-width:2.5"/><circle class="forange" cx="80.0" cy="122.0" r="4"/><circle class="forange" cx="164.3" cy="141.8" r="4"/><circle class="forange" cx="248.6" cy="159.6" r="4"/><circle class="forange" cx="332.9" cy="175.7" r="4"/><circle class="forange" cx="417.1" cy="190.1" r="4"/><circle class="forange" cx="501.4" cy="203.1" r="4"/><circle class="forange" cx="585.7" cy="214.8" r="4"/><circle class="forange" cx="670.0" cy="225.3" r="4"/><text class="cap halo" x="86.0" y="170.0">cả hai 90% ở k = 1</text><text class="cap halo" x="682.0" y="105.00000220000001">pass@8 ≈ 100%</text><text class="cap halo" x="682.0" y="230.29721379999998">pass^8 ≈ 43%</text><text class="cap2" x="20" y="388">Agent viết code cho người tự review: pass@k hợp lý. Agent phục vụ khách hàng: pass^k, vì mỗi khách chỉ có một lần.</text></svg>
