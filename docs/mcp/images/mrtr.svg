<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-label="Client gửi tools/call id 2; server trả resultType input_required kèm inputRequests và requestState; client hỏi người dùng rồi gửi lại cùng tool call với id mới 3, kèm inputResponses và requestState nguyên văn; server trả complete. Server không lưu gì giữa hai lượt"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
--blue:#0969da;--blue-bg:#ddf4ff;--orange:#bc4c00;--orange-bg:#fff1e5;
--red:#cf222e;--red-bg:#ffebe9;--green:#1a7f37;--green-bg:#dafbe1}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;
--slot:#3d444d;--tok:#151b23;--blue:#4493f8;--blue-bg:#0c2d6b;--orange:#db6d28;--orange-bg:#3d1e00;
--red:#f85149;--red-bg:#490202;--green:#3fb950;--green-bg:#033a16}}
.bg{fill:var(--bg)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.title{font-size:20px;font-weight:600}
.row{font-size:15px;font-weight:600}
.sub{font-size:12px;fill:var(--muted)}
.cap{font-size:14px}
.cap2{font-size:13px;fill:var(--muted)}
.lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;text-anchor:middle}
.mid{text-anchor:middle}.end{text-anchor:end}
.slot{fill:none;stroke:var(--slot);stroke-width:1.5;stroke-dasharray:4 4}
.tok{fill:var(--tok);stroke:var(--slot);stroke-width:1.5}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:2}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:2}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:2}
.hatch{fill:url(#hatch);stroke:var(--red);stroke-width:2}
.fblue{fill:var(--blue)}.forange{fill:var(--orange)}.fred{fill:var(--red)}.ffg{fill:var(--fg)}
.tblue{fill:var(--blue)}.torange{fill:var(--orange)}.tred{fill:var(--red)}
.lblue{stroke:var(--blue);stroke-width:2;fill:none}
.lorange{stroke:var(--orange);stroke-width:2;fill:none}
.lred{stroke:var(--red);stroke-width:2;fill:none}
.lmuted{stroke:var(--slot);stroke-width:1.5;fill:none}
.lfg{stroke:var(--fg);stroke-width:1.5;fill:none}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.dash{stroke-dasharray:6 4}
.grid{stroke:var(--slot);stroke-width:1;opacity:.6}
.axis{stroke:var(--muted);stroke-width:1}
.static-only{opacity:0}
@media (prefers-reduced-motion: reduce){
.a-show,.a-hide{animation:none!important}.a-show{opacity:1}.a-hide{opacity:0}.static-only{opacity:1}}
</style><defs><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fblue" d="M0,0L10,5L0,10z"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="forange" d="M0,0L10,5L0,10z"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fred" d="M0,0L10,5L0,10z"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ffg" d="M0,0L10,5L0,10z"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--red-bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--red);stroke-width:2;opacity:.55"/></pattern></defs><rect class="bg" width="880" height="560" rx="12"/><text class="title" x="20" y="38">MRTR: server hỏi thêm bằng result, không mở kênh ngược</text><text class="cap2" x="20" y="62">Server không giữ gì giữa hai lượt: trạng thái nằm trong requestState mà client gửi lại nguyên văn.</text><rect class="tok" x="40" y="82" width="140" height="34" rx="7"/><text class="row mid" x="110" y="104">Người dùng</text><line class="lmuted dash" x1="110" y1="116" x2="110" y2="470"/><rect class="tok" x="320" y="82" width="140" height="34" rx="7"/><text class="row mid" x="390" y="104">Client</text><line class="lmuted dash" x1="390" y1="116" x2="390" y2="470"/><rect class="tok" x="650" y="82" width="140" height="34" rx="7"/><text class="row mid" x="720" y="104">Server</text><line class="lmuted dash" x1="720" y1="116" x2="720" y2="470"/><path class="lfg" marker-end="url(#afg)" d="M390,162H716"/><text class="cap mid halo" x="555.0" y="152">tools/call, id: 2</text><path class="lfg dash" marker-end="url(#afg)" d="M720,222H394"/><text class="cap mid halo" x="555.0" y="212">resultType: "input_required"</text><rect class="tok" x="422.4" y="232" width="125.2" height="24" rx="5"/><text class="lbl" style="font-size:13px" x="485.0" y="249">inputRequests</text><rect class="blue" x="571.6" y="232" width="116.8" height="24" rx="5"/><text class="lbl" style="font-size:13px" x="630.0" y="249">requestState</text><path class="lfg" marker-end="url(#afg)" d="M390,282H114"/><text class="cap mid halo" x="250.0" y="272">form: GitHub username?</text><path class="lfg dash" marker-end="url(#afg)" d="M110,322H386"/><text class="sub mid halo" x="250.0" y="342">"octocat"</text><rect class="slot" x="711" y="268" width="18" height="102" rx="4"/><text class="sub mid" x="575.0" y="317.0">server không lưu gì</text><text class="sub mid" x="575.0" y="333.0">giữa hai lượt</text><path class="lfg" marker-end="url(#afg)" d="M390,392H716"/><text class="cap mid halo" x="555.0" y="382">cùng tools/call, id mới: 3</text><rect class="orange" x="413.2" y="402" width="133.6" height="24" rx="5"/><text class="lbl" style="font-size:13px" x="480.0" y="419">inputResponses</text><rect class="blue" x="571.6" y="402" width="116.8" height="24" rx="5"/><text class="lbl" style="font-size:13px" x="630.0" y="419">requestState</text><path class="lfg dash" marker-end="url(#afg)" d="M720,472H394"/><text class="cap mid halo" x="555.0" y="462">resultType: "complete"</text><rect class="blue" x="20" y="497" width="14" height="14" rx="3"/><text class="sub" x="40" y="508">requestState: server tạo, client gửi lại nguyên văn</text><rect class="orange" x="421" y="497" width="14" height="14" rx="3"/><text class="sub" x="441" y="508">inputResponses: người dùng vừa nhập</text><text class="cap2" x="20" y="544">requestState đi qua client nên là input không tin cậy: ký hoặc mã hoá nếu client không được sửa.</text></svg>
