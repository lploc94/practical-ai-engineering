t="34" rx="3"/><rect class="hatch" x="441.0" y="230" width="14.0" height="34" rx="3"/><rect class="hatch" x="457.0" y="230" width="14.0" height="34" rx="3"/><rect class="hatch" x="473.0" y="230" width="14.0" height="34" rx="3"/><rect class="hatch" x="489.0" y="230" width="14.0" height="34" rx="3"/><rect class="hatch" x="505.0" y="230" width="14.0" height="34" rx="3"/><rect class="hatch" x="521.0" y="230" width="14.0" height="34" rx="3"/><rect class="hatch" x="537.0" y="230" width="14.0" height="34" rx="3"/><text class="cap" x="120" y="290" style="font-weight:600">3 × 3 × 3 = 27 request cho một lần bấm</text><text class="sub" x="120" y="308">nhân thêm với số người dùng đang bấm "thử lại"</text><line class="grid" x1="586" y1="90" x2="586" y2="330"/><text class="row" x="612" y="108">Một tầng làm chủ</text><rect class="tok" x="612" y="130" width="80" height="34" rx="3"/><text class="sub mid" x="652.0" y="151.0">chính</text><rect class="slot" x="612" y="180" width="80" height="34" rx="3"/><text class="sub mid" x="652.0" y="201.0">1 lần</text><rect class="blue" x="612" y="230" width="80" height="34" rx="3"/><path class="lfg" d="M652.0,166L652.0,176" marker-end="url(#afg)"/><path class="lfg" d="M652.0,216L652.0,226" marker-end="url(#afg)"/><rect class="tok" x="694" y="130" width="80" height="34" rx="3"/><text class="sub mid" x="734.0" y="151.0">chính</text><rect class="slot" x="694" y="180" width="80" height="34" rx="3"/><text class="sub mid" x="734.0" y="201.0">1 lần</text><rect class="blue" x="694" y="230" width="80" height="34" rx="3"/><path class="lfg" d="M734.0,166L734.0,176" marker-end="url(#afg)"/><path class="lfg" d="M734.0,216L734.0,226" marker-end="url(#afg)"/><rect class="tok" x="776" y="130" width="80" height="34" rx="3"/><text class="sub mid" x="816.0" y="151.0">fallback</text><rect class="slot" x="776" y="180" width="80" height="34" rx="3"/><text class="sub mid" x="816.0" y="201.0">1 lần</text><rect class="blue" x="776" y="230" width="80" height="34" rx="3"/><path class="lfg" d="M816.0,166L816.0,176" marker-end="url(#afg)"/><path class="lfg" d="M816.0,216L816.0,226" marker-end="url(#afg)"/><rect class="tok" x="858" y="130" width="80" height="34" rx="3"/><text class="sub mid" x="898.0" y="151.0">fallback</text><rect class="slot" x="858" y="180" width="80" height="34" rx="3"/><text class="sub mid" x="898.0" y="201.0">1 lần</text><rect class="blue" x="858" y="230" width="80" height="34" rx="3"/><path class="lfg" d="M898.0,166L898.0,176" marker-end="url(#afg)"/><path class="lfg" d="M898.0,216L898.0,226" marker-end="url(#afg)"/><text class="cap" x="612" y="290" style="font-weight:600">tối đa 4 request</text><text class="sub" x="612" y="308">SDK đặt max_retries=0</text><text class="cap2" x="20" y="366">SDK, gateway và ứng dụng đều có thể retry. Chọn một tầng làm chủ, tắt retry ở các tầng còn lại,</text><text class="cap2" x="20" y="384">và đặt trần cho cả chuỗi: tổng số lần thử và tổng thời gian.</text></svg>
