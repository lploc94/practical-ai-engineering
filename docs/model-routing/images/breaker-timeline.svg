<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 545" width="980" height="545" role="img" aria-label="Model chính lỗi 529 trong 35 giây, mỗi 3 giây có một request. Không có breaker, request nào cũng thử model chính 2 lần rồi mới sang fallback, tổng 24 lần thử thất bại. Có breaker với ngưỡng 5 và cooldown 30 giây, lỗi thứ 5 mở breaker, request sau đó đi thẳng tới fallback, hết cooldown một request thăm dò thành công và breaker đóng lại"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
