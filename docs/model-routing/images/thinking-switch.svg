<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Lượt 1 và 2 do Opus 5.5 trả lời, lượt 3 fallback sang Opus 4.8: Opus 4.8 không đọc thinking block của Opus 5.5 nên API bỏ chúng cho request đó, không báo lỗi. Lượt 4 quay về Opus 5.5 với cùng lịch sử: mọi block, kể cả block của Opus 4.8, được đọc lại"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
--blue:#0969da;--blue-bg:#ddf4ff;--orange:#bc4c00;--orange-bg:#fff1e5;
--red:#cf222e;--red-bg:#ffebe9;--green:#1a7f37;--green-bg:#dafbe1}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;
--slot:#3d444d;--tok:#151b23;--blue:#4493f8;--blue-bg:#0c2d6b;--orange:#db6d28;--orange-bg:#3d1e00;
--red:#f85149;--red-bg:#490202;--green:#3fb950;--green-bg:#033a16}}
.bg{fill:var(--bg)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.title{font-size:20px;font-weight:600}
.row{font-size:15px;font-weight:600}
.sub{font-size:12px;fill:var(--muted)}
.cap{font-size:14px}
.cap2{font-size:13px;fill:var(--muted)}
.lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;text-anchor:middle}
.mid{text-anchor:middle}.end{text-anchor:end}
.slot{fill:none;stroke:var(--slot);stroke-width:1.5;stroke-dasharray:4 4}
.tok{fill:var(--tok);stroke:var(--slot);stroke-width:1.5}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:2}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:2}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:2}
.hatch{fill:url(#hatch);stroke:var(--red);stroke-width:2}
.fblue{fill:var(--blue)}.forange{fill:var(--orange)}.fred{fill:var(--red)}.ffg{fill:var(--fg)}
.tblue{fill:var(--blue)}.torange{fill:var(--orange)}.tred{fill:var(--red)}
.lblue{stroke:var(--blue);stroke-width:2;fill:none}
.lorange{stroke:var(--orange);stroke-width:2;fill:none}
.lred{stroke:var(--red);stroke-width:2;fill:none}
.lmuted{stroke:var(--slot);stroke-width:1.5;fill:none}
.lfg{stroke:var(--fg);stroke-width:1.5;fill:none}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.dash{stroke-dasharray:6 4}
.grid{stroke:var(--slot);stroke-width:1;opacity:.6}
.axis{stroke:var(--muted);stroke-width:1}
.static-only{opacity:0}
@media (prefers-reduced-motion: reduce){
.a-show,.a-hide{animation:none!important}.a-show{opacity:1}.a-hide{opacity:0}.static-only{opacity:1}}
</style><defs><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fblue" d="M0,0L10,5L0,10z"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="forange" d="M0,0L10,5L0,10z"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fred" d="M0,0L10,5L0,10z"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ffg" d="M0,0L10,5L0,10z"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--red-bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--red);stroke-width:2;opacity:.55"/></pattern></defs><rect class="bg" width="900" height="400" rx="12"/><text class="title" x="20" y="38">Fallback làm mất reasoning, quay về thì đọc lại</text><rect class="blue" x="20" y="55" width="14" height="14" rx="3"/><text class="sub" x="40" y="66">model đọc block</text><rect class="slot" x="169" y="55" width="14" height="14" rx="3"/><text class="sub" x="189" y="66">API bỏ block cho request này</text><text class="row mid" x="325.0" y="116">Request lượt 2</text><text class="sub mid" x="325.0" y="136">gửi tới Opus 5.5</text><rect class="blue" x="230" y="150" width="190" height="40" rx="6"/><text class="cap mid" x="325.0" y="175.0">đọc</text><text class="row mid" x="535.0" y="116">Request lượt 3</text><text class="sub mid" x="535.0" y="136">gửi tới Opus 4.8 (fallback)</text><rect class="slot" x="440" y="150" width="190" height="40" rx="6"/><text class="cap mid" x="535.0" y="175.0">bỏ, không lỗi</text><rect class="slot" x="440" y="202" width="190" height="40" rx="6"/><text class="cap mid" x="535.0" y="227.0">bỏ, không lỗi</text><text class="row mid" x="745.0" y="116">Request lượt 4</text><text class="sub mid" x="745.0" y="136">gửi tới Opus 5.5</text><rect class="blue" x="650" y="150" width="190" height="40" rx="6"/><text class="cap mid" x="745.0" y="175.0">đọc</text><rect class="blue" x="650" y="202" width="190" height="40" rx="6"/><text class="cap mid" x="745.0" y="227.0">đọc</text><rect class="blue" x="650" y="254" width="190" height="40" rx="6"/><text class="cap mid" x="745.0" y="279.0">đọc</text><text class="cap" x="20" y="167">Thinking lượt 1</text><text class="sub" x="20" y="183">do Opus 5.5 tạo</text><text class="cap" x="20" y="219">Thinking lượt 2</text><text class="sub" x="20" y="235">do Opus 5.5 tạo</text><text class="cap" x="20" y="271">Thinking lượt 3</text><text class="sub" x="20" y="287">do Opus 4.8 tạo</text><text class="cap" x="20" y="330">Ba request dùng chung một lịch sử, mỗi lượt chỉ nối thêm. Opus 4.8 không đọc block của Opus 5.5,</text><text class="cap" x="20" y="350">nên trả lời lượt 3 mà không có reasoning trước đó. Quay về Opus 5.5, mọi block được đọc lại.</text><text class="cap2" x="20" y="384">Block bị bỏ không tính tiền cho request đó. Đừng xoá thinking khỏi lịch sử khi đổi model.</text></svg>
