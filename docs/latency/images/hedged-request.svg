<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-label="Bản chính chưa có chữ đầu sau p95 TTFT 2 giây nên gửi bản thứ hai; bản hai có chữ đầu ở giây 3,2, được stream cho người dùng, bản chính bị huỷ; không hedge thì chữ đầu ở giây 6"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
--blue:#0969da;--blue-bg:#ddf4ff;--orange:#bc4c00;--orange-bg:#fff1e5;
--red:#cf222e;--red-bg:#ffebe9;--green:#1a7f37;--green-bg:#dafbe1}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;
--slot:#3d444d;--tok:#151b23;--blue:#4493f8;--blue-bg:#0c2d6b;--orange:#db6d28;--orange-bg:#3d1e00;
--red:#f85149;--red-bg:#490202;--green:#3fb950;--green-bg:#033a16}}
.bg{fill:var(--bg)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.title{font-size:20px;font-weight:600}
.row{font-size:15px;font-weight:600}
.sub{font-size:12px;fill:var(--muted)}
.cap{font-size:14px}
.cap2{font-size:13px;fill:var(--muted)}
.lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;text-anchor:middle}
.mid{text-anchor:middle}.end{text-anchor:end}
.slot{fill:none;stroke:var(--slot);stroke-width:1.5;stroke-dasharray:4 4}
.tok{fill:var(--tok);stroke:var(--slot);stroke-width:1.5}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:2}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:2}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:2}
.hatch{fill:url(#hatch);stroke:var(--red);stroke-width:2}
.fblue{fill:var(--blue)}.forange{fill:var(--orange)}.fred{fill:var(--red)}.ffg{fill:var(--fg)}
.tblue{fill:var(--blue)}.torange{fill:var(--orange)}.tred{fill:var(--red)}
.lblue{stroke:var(--blue);stroke-width:2;fill:none}
.lorange{stroke:var(--orange);stroke-width:2;fill:none}
.lred{stroke:var(--red);stroke-width:2;fill:none}
.lmuted{stroke:var(--slot);stroke-width:1.5;fill:none}
.lfg{stroke:var(--fg);stroke-width:1.5;fill:none}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.dash{stroke-dasharray:6 4}
.grid{stroke:var(--slot);stroke-width:1;opacity:.6}
.axis{stroke:var(--muted);stroke-width:1}
.static-only{opacity:0}
@media (prefers-reduced-motion: reduce){
.a-show,.a-hide{animation:none!important}.a-show{opacity:1}.a-hide{opacity:0}.static-only{opacity:1}}
@keyframes k1{0.0%{opacity:0} 2.27%{opacity:0} 4.55%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}@keyframes k2{0.0%{opacity:0} 9.09%{opacity:0} 11.36%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}@keyframes k3{0.0%{opacity:0} 25.0%{opacity:0} 27.27%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}@keyframes k4{0.0%{opacity:0} 31.82%{opacity:0} 34.09%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}@keyframes k5{0.0%{opacity:0} 56.82%{opacity:0} 59.09%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}</style><defs><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fblue" d="M0,0L10,5L0,10z"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="forange" d="M0,0L10,5L0,10z"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fred" d="M0,0L10,5L0,10z"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ffg" d="M0,0L10,5L0,10z"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--red-bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--red);stroke-width:2;opacity:.55"/></pattern></defs><rect class="bg" width="820" height="400" rx="12"/><text class="title" x="20" y="38">Hedge theo chữ đầu tiên: bản nào có chữ trước thì dùng</text><rect class="blue" x="20" y="59" width="14" height="14" rx="3"/><text class="sub" x="40" y="70">chờ chữ đầu: hàng đợi, prefill</text><rect class="orange" x="274" y="59" width="14" height="14" rx="3"/><text class="sub" x="294" y="70">chữ trả lời</text><text class="row" x="20" y="145">Bản chính</text><text class="sub" x="20" y="162">gửi ở giây 0</text><text class="row" x="20" y="229">Bản 2 (hedge)</text><text class="sub" x="20" y="246">gửi khi quá p95</text><rect class="slot" x="190" y="130" width="580" height="34" rx="5"/><rect class="slot" x="190" y="214" width="580" height="34" rx="5"/><g class="a-show" style="animation:k1 22.0s linear infinite"><rect class="blue" x="191.0" y="130" width="163.7" height="34" rx="5"/><text class="lbl" style="font-size:12px" x="272.9" y="152.0">chờ chữ đầu</text></g><g class="a-show" style="animation:k2 22.0s linear infinite"><line class="lfg dash" x1="355.7" y1="108" x2="355.7" y2="256"/><text class="sub halo" x="361.7" y="120">giây 2 = p95 TTFT: chưa có chữ đầu, gửi bản 2</text></g><g class="a-show" style="animation:k3 22.0s linear infinite"><rect class="blue" x="356.7" y="130" width="97.4" height="34" rx="5"/><rect class="blue" x="356.7" y="214" width="97.4" height="34" rx="5"/></g><g class="a-show" style="animation:k4 22.0s linear infinite"><rect class="orange" x="456.1" y="214" width="312.9" height="34" rx="5"/><text class="lbl" style="font-size:12px" x="612.6" y="236.0">stream cho người dùng</text><rect class="bg" x="456.1" y="131" width="230.0" height="32"/><line class="lfg" x1="455.1" y1="126" x2="455.1" y2="256"/><text class="lbl" style="font-size:12px" x="481.1" y="152.0">huỷ</text><text class="sub halo" x="461.1" y="264">chữ đầu: giây 3,2</text></g><g class="a-show" style="animation:k5 22.0s linear infinite"><line class="lfg dash" x1="687.1" y1="126" x2="687.1" y2="168"/><text class="sub halo end" x="683.1" y="180">nếu không hedge: chữ đầu ở giây 6</text><text class="cap" x="20" y="366">Chỉ khoảng 5% request chậm hơn p95 nên chỉ khoảng 5% request phải gửi bản 2.</text></g><line class="axis" x1="190" y1="288" x2="770" y2="288"/><line class="axis" x1="190.0" y1="288" x2="190.0" y2="293"/><text class="sub mid" x="190.0" y="306">0 s</text><line class="axis" x1="272.9" y1="288" x2="272.9" y2="293"/><text class="sub mid" x="272.9" y="306">1 s</text><line class="axis" x1="355.7" y1="288" x2="355.7" y2="293"/><text class="sub mid" x="355.7" y="306">2 s</text><line class="axis" x1="438.6" y1="288" x2="438.6" y2="293"/><text class="sub mid" x="438.6" y="306">3 s</text><line class="axis" x1="521.4" y1="288" x2="521.4" y2="293"/><text class="sub mid" x="521.4" y="306">4 s</text><line class="axis" x1="604.3" y1="288" x2="604.3" y2="293"/><text class="sub mid" x="604.3" y="306">5 s</text><line class="axis" x1="687.1" y1="288" x2="687.1" y2="293"/><text class="sub mid" x="687.1" y="306">6 s</text><line class="axis" x1="770.0" y1="288" x2="770.0" y2="293"/><text class="sub mid" x="770.0" y="306">7 s</text><text class="cap2" x="20" y="390">Giả định: p95 TTFT 2 s; bản 2 có TTFT 1,2 s.</text></svg>
