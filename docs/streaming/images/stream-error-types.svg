<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-label="Status 200 được gửi trước token đầu tiên: lỗi trước stream có status khác 200; lỗi trong stream đến sau status 200 dưới dạng event error; đứt kết nối thì không có event lỗi lẫn event kết thúc; chỉ event kết thúc như message_stop xác nhận stream thành công"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
--blue:#0969da;--blue-bg:#ddf4ff;--orange:#bc4c00;--orange-bg:#fff1e5;
--red:#cf222e;--red-bg:#ffebe9;--green:#1a7f37;--green-bg:#dafbe1}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;
--slot:#3d444d;--tok:#151b23;--blue:#4493f8;--blue-bg:#0c2d6b;--orange:#db6d28;--orange-bg:#3d1e00;
--red:#f85149;--red-bg:#490202;--green:#3fb950;--green-bg:#033a16}}
.bg{fill:var(--bg)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.title{font-size:20px;font-weight:600}
.row{font-size:15px;font-weight:600}
.sub{font-size:12px;fill:var(--muted)}
.cap{font-size:14px}
.cap2{font-size:13px;fill:var(--muted)}
.lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;text-anchor:middle}
.mid{text-anchor:middle}.end{text-anchor:end}
.slot{fill:none;stroke:var(--slot);stroke-width:1.5;stroke-dasharray:4 4}
.tok{fill:var(--tok);stroke:var(--slot);stroke-width:1.5}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:2}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:2}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:2}
.hatch{fill:url(#hatch);stroke:var(--red);stroke-width:2}
.fblue{fill:var(--blue)}.forange{fill:var(--orange)}.fred{fill:var(--red)}.ffg{fill:var(--fg)}
.tblue{fill:var(--blue)}.torange{fill:var(--orange)}.tred{fill:var(--red)}
.lblue{stroke:var(--blue);stroke-width:2;fill:none}
.lorange{stroke:var(--orange);stroke-width:2;fill:none}
.lred{stroke:var(--red);stroke-width:2;fill:none}
.lmuted{stroke:var(--slot);stroke-width:1.5;fill:none}
.lfg{stroke:var(--fg);stroke-width:1.5;fill:none}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.dash{stroke-dasharray:6 4}
.grid{stroke:var(--slot);stroke-width:1;opacity:.6}
.axis{stroke:var(--muted);stroke-width:1}
.static-only{opacity:0}
@media (prefers-reduced-motion: reduce){
.a-show,.a-hide{animation:none!important}.a-show{opacity:1}.a-hide{opacity:0}.static-only{opacity:1}}
</style><defs><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fblue" d="M0,0L10,5L0,10z"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="forange" d="M0,0L10,5L0,10z"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fred" d="M0,0L10,5L0,10z"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ffg" d="M0,0L10,5L0,10z"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--red-bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--red);stroke-width:2;opacity:.55"/></pattern></defs><rect class="bg" width="820" height="420" rx="12"/><text class="title" x="20" y="38">Status 200 đến trước token đầu, nên lỗi sau đó nằm trong body</text><rect class="tok" x="20" y="55" width="14" height="14" rx="3"/><text class="sub" x="40" y="66">status, event kết thúc</text><rect class="blue" x="218" y="55" width="14" height="14" rx="3"/><text class="sub" x="238" y="66">delta nội dung</text><rect class="hatch" x="360" y="55" width="14" height="14" rx="3"/><text class="sub" x="380" y="66">lỗi</text><text class="row" x="20" y="126">Thành công</text><text class="sub" x="20" y="143">có event kết thúc</text><text class="row" x="20" y="192">1. Lỗi trước stream</text><text class="sub" x="20" y="209">status khác 200</text><text class="row" x="20" y="258">2. Lỗi trong stream</text><text class="sub" x="20" y="275">200, rồi event lỗi</text><text class="row" x="20" y="324">3. Đứt kết nối</text><text class="sub" x="20" y="341">không lỗi, không kết thúc</text><rect class="tok" x="230" y="112" width="92" height="32" rx="6"/><text class="lbl halo" style="font-size:13px" x="276.0" y="133.0">HTTP 200</text><rect class="blue" x="336" y="112" width="66" height="32" rx="6"/><text class="lbl halo" style="font-size:13px" x="369.0" y="133.0">delta</text><rect class="blue" x="410" y="112" width="66" height="32" rx="6"/><text class="lbl halo" style="font-size:13px" x="443.0" y="133.0">delta</text><rect class="blue" x="484" y="112" width="66" height="32" rx="6"/><text class="lbl halo" style="font-size:13px" x="517.0" y="133.0">delta</text><rect class="tok" x="564" y="112" width="170" height="32" rx="6"/><text class="lbl halo" style="font-size:13px" x="649.0" y="133.0">message_stop</text><rect class="hatch" x="230" y="178" width="92" height="32" rx="6"/><text class="lbl halo" style="font-size:13px" x="276.0" y="199.0">HTTP 529</text><text class="cap2" x="336" y="199.0">chưa có byte nào của stream; SDK xử lý theo status</text><rect class="tok" x="230" y="244" width="92" height="32" rx="6"/><text class="lbl halo" style="font-size:13px" x="276.0" y="265.0">HTTP 200</text><rect class="blue" x="336" y="244" width="66" height="32" rx="6"/><text class="lbl halo" style="font-size:13px" x="369.0" y="265.0">delta</text><rect class="blue" x="410" y="244" width="66" height="32" rx="6"/><text class="lbl halo" style="font-size:13px" x="443.0" y="265.0">delta</text><rect class="hatch" x="564" y="244" width="170" height="32" rx="6"/><text class="lbl halo" style="font-size:13px" x="649.0" y="265.0">event: error</text><text class="sub halo" x="734" y="291" style="text-anchor:end">sau đó không có message_stop</text><rect class="tok" x="230" y="310" width="92" height="32" rx="6"/><text class="lbl halo" style="font-size:13px" x="276.0" y="331.0">HTTP 200</text><rect class="blue" x="336" y="310" width="66" height="32" rx="6"/><text class="lbl halo" style="font-size:13px" x="369.0" y="331.0">delta</text><rect class="blue" x="410" y="310" width="66" height="32" rx="6"/><text class="lbl halo" style="font-size:13px" x="443.0" y="331.0">delta</text><path class="lred" style="stroke-width:3" d="M488,304 l8,12.666666666666666 l-8,12.666666666666666 l8,14.666666666666666"/><rect class="slot" x="510" y="310" width="224" height="32" rx="6"/><text class="sub mid" x="622.0" y="330.0">kết nối đóng, không có event nào</text><line class="lfg dash" x1="329" y1="94" x2="329" y2="348"/><text class="sub halo" x="335" y="102">sau mốc này status không đổi được nữa</text><line class="axis" x1="230" y1="368" x2="734" y2="368" marker-end="url(#afg)"/><text class="sub end" x="734" y="384">thứ tự byte đến client</text><text class="cap2" x="20" y="408">Tên event theo Claude. Chỉ coi là xong khi có event kết thúc (message_stop, [DONE], ...).</text></svg>
