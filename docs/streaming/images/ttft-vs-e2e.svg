<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" width="820" height="390" role="img" aria-label="Với TTFT 0,8 giây, ITL 20 ms và 1.500 token, cả stream và không stream đều xong ở giây 30,8; khi stream người dùng thấy chữ từ giây 0,8, khi không stream phải chờ đến giây 30,8"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
--blue:#0969da;--blue-bg:#ddf4ff;--orange:#bc4c00;--orange-bg:#fff1e5;
--red:#cf222e;--red-bg:#ffebe9;--green:#1a7f37;--green-bg:#dafbe1}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;
--slot:#3d444d;--tok:#151b23;--blue:#4493f8;--blue-bg:#0c2d6b;--orange:#db6d28;--orange-bg:#3d1e00;
--red:#f85149;--red-bg:#490202;--green:#3fb950;--green-bg:#033a16}}
.bg{fill:var(--bg)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.title{font-size:20px;font-weight:600}
.row{font-size:15px;font-weight:600}
.sub{font-size:12px;fill:var(--muted)}
.cap{font-size:14px}
.cap2{font-size:13px;fill:var(--muted)}
.lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;text-anchor:middle}
.mid{text-anchor:middle}.end{text-anchor:end}
.slot{fill:none;stroke:var(--slot);stroke-width:1.5;stroke-dasharray:4 4}
.tok{fill:var(--tok);stroke:var(--slot);stroke-width:1.5}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:2}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:2}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:2}
.hatch{fill:url(#hatch);stroke:var(--red);stroke-width:2}
.fblue{fill:var(--blue)}.forange{fill:var(--orange)}.fred{fill:var(--red)}.ffg{fill:var(--fg)}
.tblue{fill:var(--blue)}.torange{fill:var(--orange)}.tred{fill:var(--red)}
.lblue{stroke:var(--blue);stroke-width:2;fill:none}
.lorange{stroke:var(--orange);stroke-width:2;fill:none}
.lred{stroke:var(--red);stroke-width:2;fill:none}
.lmuted{stroke:var(--slot);stroke-width:1.5;fill:none}
.lfg{stroke:var(--fg);stroke-width:1.5;fill:none}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.dash{stroke-dasharray:6 4}
.grid{stroke:var(--slot);stroke-width:1;opacity:.6}
.axis{stroke:var(--muted);stroke-width:1}
.static-only{opacity:0}
@media (prefers-reduced-motion: reduce){
.a-show,.a-hide{animation:none!important}.a-show{opacity:1}.a-hide{opacity:0}.static-only{opacity:1}}
@keyframes k1{0.0%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}@keyframes k2{0.0%{opacity:0} 6%{opacity:0} 7%{opacity:1} 61.5%{opacity:1} 62%{opacity:0} 95%{opacity:0} 100.0%{opacity:0.0}}@keyframes k3{0.0%{opacity:0} 61.5%{opacity:0} 62.5%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}@keyframes k4{0.0%{opacity:0} 6.96%{opacity:0} 7.96%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}@keyframes k5{0.0%{opacity:0} 61.5%{opacity:0} 62.5%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}@keyframes k6{0.0%{opacity:0} 64%{opacity:0} 66%{opacity:1} 95%{opacity:1} 100.0%{opacity:0.0}}</style><defs><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fblue" d="M0,0L10,5L0,10z"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="forange" d="M0,0L10,5L0,10z"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fred" d="M0,0L10,5L0,10z"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ffg" d="M0,0L10,5L0,10z"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--red-bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--red);stroke-width:2;opacity:.55"/></pattern></defs><rect class="bg" width="820" height="390" rx="12"/><text class="title" x="20" y="38">Stream và không stream: cùng tổng thời gian, khác lúc thấy chữ</text><rect class="blue" x="20" y="55" width="14" height="14" rx="3"/><text class="sub" x="40" y="66">TTFT: xếp hàng, prefill</text><rect class="orange" x="225" y="55" width="14" height="14" rx="3"/><text class="sub" x="245" y="66">token output</text><text class="row" x="20" y="114">Model sinh</text><text class="sub" x="20" y="131">giống nhau ở hai chế độ</text><rect class="slot" x="200" y="100" width="580" height="30" rx="5"/><text class="row" x="20" y="184">Stream</text><text class="sub" x="20" y="201">người dùng thấy</text><rect class="slot" x="200" y="170" width="580" height="30" rx="5"/><text class="row" x="20" y="254">Không stream</text><text class="sub" x="20" y="271">người dùng thấy</text><rect class="slot" x="200" y="240" width="580" height="30" rx="5"/><g class="a-show" style="animation:k1 18s linear infinite"><rect class="blue" x="200" y="100" width="15.1" height="30" rx="3"/><rect class="orange" x="216.1" y="100" width="68.6" height="30" rx="3"/><rect class="orange" x="216.1" y="170" width="68.6" height="30" rx="3"/><rect class="orange" x="286.7" y="100" width="68.6" height="30" rx="3"/><rect class="orange" x="286.7" y="170" width="68.6" height="30" rx="3"/><rect class="orange" x="357.3" y="100" width="68.6" height="30" rx="3"/><rect class="orange" x="357.3" y="170" width="68.6" height="30" rx="3"/><rect class="orange" x="427.9" y="100" width="68.6" height="30" rx="3"/><rect class="orange" x="427.9" y="170" width="68.6" height="30" rx="3"/><rect class="orange" x="498.5" y="100" width="68.6" height="30" rx="3"/><rect class="orange" x="498.5" y="170" width="68.6" height="30" rx="3"/><rect class="orange" x="569.2" y="100" width="68.6" height="30" rx="3"/><rect class="orange" x="569.2" y="170" width="68.6" height="30" rx="3"/><rect class="orange" x="639.8" y="100" width="68.6" height="30" rx="3"/><rect class="orange" x="639.8" y="170" width="68.6" height="30" rx="3"/><rect class="orange" x="710.4" y="100" width="68.6" height="30" rx="3"/><rect class="orange" x="710.4" y="170" width="68.6" height="30" rx="3"/></g><style>@keyframes cover{0%{transform:translateX(0)}6%{transform:translateX(0)}62%{transform:translateX(584px)}100%{transform:translateX(584px)}}</style><g class="a-hide" style="animation:cover 18s linear infinite"><rect class="bg" x="198" y="97" width="586" height="36"/></g><g class="a-hide" style="animation:cover 18s linear infinite"><rect class="bg" x="198" y="167" width="586" height="36"/></g><g class="a-hide" style="animation:k2 18s linear infinite"><text class="cap2" x="490.0" y="260" style="text-anchor:middle">đang chờ…</text></g><g class="a-show" style="animation:k3 18s linear infinite"><rect class="orange" x="216.1" y="240" width="562.9" height="30" rx="3"/></g><g class="a-show" style="animation:k4 18s linear infinite"><line class="lfg dash" x1="215.1" y1="164" x2="215.1" y2="206"/><text class="sub halo" x="221.1" y="217">chữ đầu tiên: giây 0,8</text></g><g class="a-show" style="animation:k5 18s linear infinite"><line class="lfg dash" x1="780" y1="234" x2="780" y2="276"/><text class="sub end halo" x="774" y="287">chữ đầu tiên: giây 30,8</text></g><line class="axis" x1="200" y1="310" x2="780" y2="310"/><line class="axis" x1="200.0" y1="310" x2="200.0" y2="315"/><text class="sub mid" x="200.0" y="328">0 s</text><line class="axis" x1="388.4" y1="310" x2="388.4" y2="315"/><text class="sub mid" x="388.4" y="328">10 s</text><line class="axis" x1="576.9" y1="310" x2="576.9" y2="315"/><text class="sub mid" x="576.9" y="328">20 s</text><line class="axis" x1="765.3" y1="310" x2="765.3" y2="315"/><text class="sub mid" x="765.3" y="328">30 s</text><style>@keyframes cur{0%{transform:translateX(0);opacity:0}6%{transform:translateX(0);opacity:1}62%{transform:translateX(580px);opacity:1}64%{transform:translateX(580px);opacity:0}100%{transform:translateX(580px);opacity:0}}</style><g class="a-hide" style="animation:cur 18s linear infinite"><line class="lfg" x1="200" y1="90" x2="200" y2="310"/></g><g class="a-show" style="animation:k6 18s linear infinite"><text class="cap" x="20" y="356">Cả hai chế độ xong ở giây 30,8; stream chỉ đổi lúc người dùng thấy chữ đầu tiên.</text></g><text class="cap2" x="20" y="378">Số liệu giả định từ ví dụ §1.1: TTFT 0,8 s, ITL 20 ms, 1.500 token output.</text></svg>
