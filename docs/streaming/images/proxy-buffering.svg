<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 436" width="820" height="436" role="img" aria-label="Khi proxy_buffering bật, nginx giữ 5 event SSE trong buffer và trình duyệt nhận cả 5 cùng lúc khi upstream kết thúc; khi tắt buffering hoặc gửi X-Accel-Buffering: no, mỗi event tới trình duyệt ngay sau khi origin gửi"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
