<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" width="860" height="390" role="img" aria-label="Cosine của các cặp câu hỏi dùng chung đáp án và các cặp cần đáp án khác nằm xen kẽ nhau; nâng ngưỡng từ 0.90 lên 0.95 giảm trúng nhầm từ 5 xuống 2 nhưng bỏ lỡ 14 trên 20 cặp dùng lại được"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
