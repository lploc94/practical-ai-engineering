alo" x="185.4" y="326.0">A · đoạn ngắn</text><text class="cap halo" x="348.5" y="221.0">B · bài dài</text><text class="cap halo" x="143.6" y="189.2">C · chủ đề lệch hơn</text><line class="lorange" x1="70" y1="370" x2="201.5" y2="238.5" marker-end="url(#aorange)" style="stroke-width:3"/><text class="cap halo" x="173.5" y="228.5" style="font-weight:600">q · query</text><text class="row" x="510" y="118">Cosine — chỉ nhìn góc</text><text class="lbl" x="510" y="144" style="text-anchor:start">A (0.97) = B (0.97) &gt; C (0.91)</text><text class="cap2" x="510" y="166">A và B ngang nhau: độ dài bị bỏ qua</text><text class="row" x="510" y="206">Dot product — góc × độ dài</text><text class="lbl" x="510" y="232" style="text-anchor:start">B (14.5) &gt; C (8.2) &gt; A (5.8)</text><text class="cap2" x="510" y="254">B dài nên vượt lên; A ngắn tụt xuống cuối</text><text class="row" x="510" y="294">L2 — khoảng cách hai đầu mút</text><text class="lbl" x="510" y="320" style="text-anchor:start">A (1.19) &lt; C (1.30) &lt; B (2.24)</text><text class="cap2" x="510" y="342">Nhỏ hơn là gần hơn; B xa nhất vì quá dài</text><text class="cap2" x="510" y="378">Khi mọi vector được chuẩn hoá về độ dài 1,</text><text class="cap2" x="510" y="396">ba phép đo cho cùng một thứ hạng.</text></svg>
