<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Query q và ba tài liệu: A và B cùng hướng nhưng B dài hơn. Cosine xếp A bằng B, dot product xếp B cao nhất, L2 xếp A gần nhất và B xa nhất"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
