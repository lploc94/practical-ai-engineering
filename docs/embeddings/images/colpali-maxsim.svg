<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Câu hỏi doanh thu quý 3 miền Nam: mỗi token khớp với một patch ở một góc khác nhau của trang và MaxSim cộng ba điểm khớp tốt nhất; single-vector lấy trung bình cả trang nên ba vùng này bị pha loãng"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
