marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ffg" d="M0,0L10,5L0,10z"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--red-bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--red);stroke-width:2;opacity:.55"/></pattern></defs><rect class="bg" width="880" height="400" rx="12"/><text class="title" x="20" y="40">HNSW: tìm từ tầng thưa xuống tầng dày</text><rect class="orange" x="550" y="29" width="14" height="14" rx="3"/><text class="sub" x="570" y="40">đường đi của truy vấn</text><rect class="blue" x="741" y="29" width="14" height="14" rx="3"/><text class="sub" x="761" y="40">top-3</text><text class="row" x="20" y="125">Tầng 2</text><text class="sub" x="20" y="143">ít node, cạnh dài</text><text class="row" x="20" y="210">Tầng 1</text><text class="row" x="20" y="295">Tầng 0</text><text class="sub" x="20" y="313">mọi vector</text><line class="lmuted dash" x1="260" y1="129" x2="260" y2="196"/><line class="lmuted dash" x1="540" y1="129" x2="540" y2="196"/><line class="lmuted dash" x1="780" y1="129" x2="780" y2="196"/><line class="lmuted dash" x1="260" y1="214" x2="260" y2="281"/><line class="lmuted dash" x1="380" y1="214" x2="380" y2="281"/><line class="lmuted dash" x1="540" y1="214" x2="540" y2="281"/><line class="lmuted dash" x1="660" y1="214" x2="660" y2="281"/><line class="lmuted dash" x1="780" y1="214" x2="780" y2="281"/><line class="lfg dash" x1="644.0" y1="86" x2="644.0" y2="312" style="opacity:.6"/><text class="cap mid" x="644.0" y="80" style="font-weight:600">q</text><line class="lmuted" x1="269" y1="120" x2="531" y2="120"/><line class="lmuted" x1="549" y1="120" x2="771" y2="120"/><circle class="tok" cx="260" cy="120" r="9"/><circle class="tok" cx="540" cy="120" r="9"/><circle class="tok" cx="780" cy="120" r="9"/><line class="lmuted" x1="269" y1="205" x2="371" y2="205"/><line class="lmuted" x1="389" y1="205" x2="531" y2="205"/><line class="lmuted" x1="549" y1="205" x2="651" y2="205"/><line class="lmuted" x1="669" y1="205" x2="771" y2="205"/><circle class="tok" cx="260" cy="205" r="9"/><circle class="tok" cx="380" cy="205" r="9"/><circle class="tok" cx="540" cy="205" r="9"/><circle class="tok" cx="660" cy="205" r="9"/><circle class="tok" cx="780" cy="205" r="9"/><line class="lmuted" x1="229" y1="290" x2="251" y2="290"/><line class="lmuted" x1="269" y1="290" x2="291" y2="290"/><line class="lmuted" x1="309" y1="290" x2="331" y2="290"/><line class="lmuted" x1="349" y1="290" x2="371" y2="290"/><line class="lmuted" x1="389" y1="290" x2="411" y2="290"/><line class="lmuted" x1="429" y1="290" x2="451" y2="290"/><line class="lmuted" x1="469" y1="290" x2="491" y2="290"/><line class="lmuted" x1="509" y1="290" x2="531" y2="290"/><line class="lmuted" x1="549" y1="290" x2="571" y2="290"/><line class="lmuted" x1="589" y1="290" x2="611" y2="290"/><line class="lmuted" x1="629" y1="290" x2="651" y2="290"/><line class="lmuted" x1="669" y1="290" x2="691" y2="290"/><line class="lmuted" x1="709" y1="290" x2="731" y2="290"/><line class="lmuted" x1="749" y1="290" x2="771" y2="290"/><line class="lmuted" x1="789" y1="290" x2="811" y2="290"/><path class="lmuted" d="M300,299 Q360.0,316 420,299"/><path class="lmuted" d="M500,299 Q560.0,316 620,299"/><path class="lmuted" d="M660,299 Q700.0,316 740,299"/><circle class="tok" cx="220" cy="290" r="9"/><circle class="tok" cx="260" cy="290" r="9"/><circle class="tok" cx="300" cy="290" r="9"/><circle class="tok" cx="340" cy="290" r="9"/><circle class="tok" cx="380" cy="290" r="9"/><circle class="tok" cx="420" cy="290" r="9"/><circle class="tok" cx="460" cy="290" r="9"/><circle class="tok" cx="500" cy="290" r="9"/><circle class="tok" cx="540" cy="290" r="9"/><circle class="tok" cx="580" cy="290" r="9"/><circle class="tok" cx="620" cy="290" r="9"/><circle class="tok" cx="660" cy="290" r="9"/><circle class="tok" cx="700" cy="290" r="9"/><circle class="tok" cx="740" cy="290" r="9"/><circle class="tok" cx="780" cy="290" r="9"/><circle class="tok" cx="820" cy="290" r="9"/><g class="a-show" style="animation:k1 20s linear infinite"><circle class="orange" cx="260" cy="120" r="9"/></g><g class="a-show" style="animation:k2 20s linear infinite"><text class="sub mid halo" x="260" y="102">điểm vào</text></g><g class="a-show" style="animation:k3 20s linear infinite"><path class="lorange" d="M260,109 Q400.0,75 536,107" marker-end="url(#aorange)"/></g><g class="a-show" style="animation:k4 20s linear infinite"><circle class="orange" cx="540" cy="120" r="9"/></g><g class="a-show" style="animation:k5 20s linear infinite"><line class="lorange" x1="544" y1="131" x2="544" y2="193" marker-end="url(#aorange)"/></g><g class="a-show" style="animation:k6 20s linear infinite"><circle class="orange" cx="540" cy="205" r="9"/></g><g class="a-show" style="animation:k7 20s linear infinite"><path class="lorange" d="M540,194 Q600.0,160 656,192" marker-end="url(#aorange)"/></g><g class="a-show" style="animation:k8 20s linear infinite"><circle class="orange" cx="660" cy="205" r="9"/></g><g class="a-show" style="animation:k9 20s linear infinite"><line class="lorange" x1="664" y1="216" x2="664" y2="278" marker-end="url(#aorange)"/></g><g class="a-show" style="animation:k10 20s linear infinite"><circle class="orange" cx="660" cy="290" r="9"/></g><g class="a-hide" style="animation:k11 20s linear infinite"><circle class="lorange dash" cx="620" cy="290" r="14"/><circle class="lorange dash" cx="700" cy="290" r="14"/><circle class="lorange dash" cx="740" cy="290" r="14"/></g><g class="a-show" style="animation:k12 20s linear infinite"><circle class="blue" cx="660" cy="290" r="12"/><circle class="blue" cx="620" cy="290" r="12"/><circle class="blue" cx="700" cy="290" r="12"/><text class="sub mid halo" x="660.0" y="330">top-3 gần q nhất</text></g><g class="a-hide" style="animation:k13 20s linear infinite"><text class="cap" x="20" y="352">Tầng trên thưa: mỗi bước nhảy đi xa, nhanh chóng đến vùng gần q.</text><text class="cap2" x="20" y="374">Nhảy tới láng giềng gần q nhất; khi không còn ai gần hơn thì xuống tầng dưới.</text></g><g class="a-hide" style="animation:k14 20s linear infinite"><text class="cap" x="20" y="352">Xuống tầng dưới, tiếp tục từ chính node vừa dừng.</text><text class="cap2" x="20" y="374">Tầng 0 có mọi vector nên xét kỹ các láng giềng quanh đó.</text></g><g class="a-hide" style="animation:k15 20s linear infinite"><text class="cap" x="20" y="352">Kết quả: top-3 vector gần q nhất.</text><text class="cap2" x="20" y="374">Chỉ duyệt vài node thay vì so q với cả 16 vector; đổi lại có thể bỏ sót (approximate).</text></g><g class="static-only"><text class="cap" x="20" y="352">Bắt đầu ở tầng thưa, nhảy tới láng giềng gần q nhất, hết đường thì xuống tầng dưới.</text><text class="cap2" x="20" y="374">Tầng 0 chứa mọi vector: xét kỹ quanh đó để lấy top-3, thay vì so q với cả 16 vector.</text></g></svg>
