ss="tok" x="488" y="284" width="128" height="46" rx="6"/><text class="cap mid" x="552.0" y="312.0">đẩy xa</text><rect class="blue" x="622" y="284" width="128" height="46" rx="6"/><text class="cap mid" x="686.0" y="312.0">kéo gần</text><text class="cap" x="20" y="362">Mỗi hàng là bài phân loại 4 lựa chọn; mỗi query có B − 1 = 3 negative mà không cần gán nhãn.</text><text class="cap2" x="20" y="386">q2 và q4 trùng tài liệu đúng: hai ô sọc dạy model đẩy xa một cặp thực sự liên quan.</text></svg>
