<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-label="Rule 100 request trong 10 giây đếm theo JA4; botnet dùng chung một JA4 gửi 80, 70 và 90 request vào ba data center: không counter nào vượt 100 nên không bị chặn, dù tổng 240 request đã vượt ngưỡng (số liệu giả định)"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
--blue:#0969da;--blue-bg:#ddf4ff;--orange:#bc4c00;--orange-bg:#fff1e5;
--red:#cf222e;--red-bg:#ffebe9;--green:#1a7f37;--green-bg:#dafbe1}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;
--slot:#3d444d;--tok:#151b23;--blue:#4493f8;--blue-bg:#0c2d6b;--orange:#db6d28;--orange-bg:#3d1e00;
--red:#f85149;--red-bg:#490202;--green:#3fb950;--green-bg:#033a16}}
.bg{fill:var(--bg)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.title{font-size:20px;font-weight:600}
.row{font-size:15px;font-weight:600}
.sub{font-size:12px;fill:var(--muted)}
.cap{font-size:14px}
.cap2{font-size:13px;fill:var(--muted)}
.lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;text-anchor:middle}
.mid{text-anchor:middle}.end{text-anchor:end}
.slot{fill:none;stroke:var(--slot);stroke-width:1.5;stroke-dasharray:4 4}
.tok{fill:var(--tok);stroke:var(--slot);stroke-width:1.5}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:2}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:2}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:2}
.hatch{fill:url(#hatch);stroke:var(--red);stroke-width:2}
.fblue{fill:var(--blue)}.forange{fill:var(--orange)}.fred{fill:var(--red)}.ffg{fill:var(--fg)}
.tblue{fill:var(--blue)}.torange{fill:var(--orange)}.tred{fill:var(--red)}
.lblue{stroke:var(--blue);stroke-width:2;fill:none}
.lorange{stroke:var(--orange);stroke-width:2;fill:none}
.lred{stroke:var(--red);stroke-width:2;fill:none}
.lmuted{stroke:var(--slot);stroke-width:1.5;fill:none}
.lfg{stroke:var(--fg);stroke-width:1.5;fill:none}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.dash{stroke-dasharray:6 4}
.grid{stroke:var(--slot);stroke-width:1;opacity:.6}
.axis{stroke:var(--muted);stroke-width:1}
.static-only{opacity:0}
@media (prefers-reduced-motion: reduce){
.a-show,.a-hide{animation:none!important}.a-show{opacity:1}.a-hide{opacity:0}.static-only{opacity:1}}
</style><defs><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fblue" d="M0,0L10,5L0,10z"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="forange" d="M0,0L10,5L0,10z"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fred" d="M0,0L10,5L0,10z"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ffg" d="M0,0L10,5L0,10z"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--red-bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--red);stroke-width:2;opacity:.55"/></pattern></defs><rect class="bg" width="760" height="460" rx="12"/><text class="title" x="20" y="38">Rate limiting đếm riêng ở từng data center</text><text class="cap2" x="20" y="62">Rule 100 request / 10 giây đếm theo JA4 (Enterprise). Botnet chung một JA4, rải ra ba data center. Số liệu giả định.</text><rect class="blue" x="20" y="77" width="14" height="14" rx="3"/><text class="sub" x="40" y="88">counter của một data center</text><rect class="slot" x="253" y="77" width="14" height="14" rx="3"/><text class="sub" x="273" y="88">tổng (không nơi nào đếm)</text><line class="grid" x1="90" y1="370.0" x2="700" y2="370.0"/><text class="sub end" x="82" y="374.0">0</text><line class="grid" x1="90" y1="324.0" x2="700" y2="324.0"/><text class="sub end" x="82" y="328.0">50</text><line class="grid" x1="90" y1="278.0" x2="700" y2="278.0"/><text class="sub end" x="82" y="282.0">100</text><line class="grid" x1="90" y1="232.0" x2="700" y2="232.0"/><text class="sub end" x="82" y="236.0">150</text><line class="grid" x1="90" y1="186.0" x2="700" y2="186.0"/><text class="sub end" x="82" y="190.0">200</text><line class="grid" x1="90" y1="140.0" x2="700" y2="140.0"/><text class="sub end" x="82" y="144.0">250</text><line class="axis" x1="90" y1="370" x2="700" y2="370"/><text class="sub" x="20" y="126">request / 10 giây</text><rect class="blue" x="130" y="296.4" width="90" height="73.60000000000002" rx="3"/><text class="cap mid" x="175.0" y="392">Data center 1</text><rect class="blue" x="280" y="305.6" width="90" height="64.39999999999998" rx="3"/><text class="cap mid" x="325.0" y="392">Data center 2</text><rect class="blue" x="430" y="287.2" width="90" height="82.80000000000001" rx="3"/><text class="cap mid" x="475.0" y="392">Data center 3</text><rect class="slot" x="580" y="149.20000000000002" width="90" height="220.79999999999998" rx="3"/><text class="row mid halo" x="625.0" y="141.20000000000002">240</text><text class="cap mid" x="625.0" y="392">Tổng</text><text class="sub mid" x="625.0" y="410">80 + 70 + 90</text><line class="lfg dash" x1="90" y1="278.0" x2="700" y2="278.0"/><text class="sub halo" x="96" y="272.0">ngưỡng 100</text><text class="cap" x="20" y="440">Không counter nào vượt 100 nên không bị chặn, dù tổng 240 request đã vượt ngưỡng.</text></svg>
