<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" width="740" height="420" role="img" aria-label="Trường hợp A: Recall@50 bằng 0,85, Recall@10 sau rerank bằng 0,70, 15% đáp án rơi ở rerank nên sửa rerank hoặc số đoạn. Trường hợp B: Recall@50 bằng 0,50, một nửa đáp án không tới reranker nên phải sửa chunk, embedding hoặc thêm BM25"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
--blue:#0969da;--blue-bg:#ddf4ff;--orange:#bc4c00;--orange-bg:#fff1e5;
--red:#cf222e;--red-bg:#ffebe9;--green:#1a7f37;--green-bg:#dafbe1}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;
--slot:#3d444d;--tok:#151b23;--blue:#4493f8;--blue-bg:#0c2d6b;--orange:#db6d28;--orange-bg:#3d1e00;
--red:#f85149;--red-bg:#490202;--green:#3fb950;--green-bg:#033a16}}
.bg{fill:var(--bg)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.title{font-size:20px;font-weight:600}
.row{font-size:15px;font-weight:600}
.sub{font-size:12px;fill:var(--muted)}
.cap{font-size:14px}
.cap2{font-size:13px;fill:var(--muted)}
.lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;text-anchor:middle}
.mid{text-anchor:middle}.end{text-anchor:end}
.slot{fill:none;stroke:var(--slot);stroke-width:1.5;stroke-dasharray:4 4}
.tok{fill:var(--tok);stroke:var(--slot);stroke-width:1.5}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:2}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:2}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:2}
.hatch{fill:url(#hatch);stroke:var(--red);stroke-width:2}
.fblue{fill:var(--blue)}.forange{fill:var(--orange)}.fred{fill:var(--red)}.ffg{fill:var(--fg)}
.tblue{fill:var(--blue)}.torange{fill:var(--orange)}.tred{fill:var(--red)}
.lblue{stroke:var(--blue);stroke-width:2;fill:none}
.lorange{stroke:var(--orange);stroke-width:2;fill:none}
.lred{stroke:var(--red);stroke-width:2;fill:none}
.lmuted{stroke:var(--slot);stroke-width:1.5;fill:none}
.lfg{stroke:var(--fg);stroke-width:1.5;fill:none}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.dash{stroke-dasharray:6 4}
.grid{stroke:var(--slot);stroke-width:1;opacity:.6}
.axis{stroke:var(--muted);stroke-width:1}
.static-only{opacity:0}
@media (prefers-reduced-motion: reduce){
.a-show,.a-hide{animation:none!important}.a-show{opacity:1}.a-hide{opacity:0}.static-only{opacity:1}}
</style><defs><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fblue" d="M0,0L10,5L0,10z"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="forange" d="M0,0L10,5L0,10z"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fred" d="M0,0L10,5L0,10z"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ffg" d="M0,0L10,5L0,10z"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--red-bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--red);stroke-width:2;opacity:.55"/></pattern></defs><rect class="bg" width="740" height="420" rx="12"/><text class="title" x="20" y="36">Recall của từng tầng chỉ ra tầng cần sửa</text><text class="cap2" x="20" y="58">Số liệu ví dụ của §1.2. Cả thanh = mọi câu hỏi có tài liệu đúng trong corpus.</text><rect class="blue" x="20" y="79" width="14" height="14" rx="3"/><text class="sub" x="40" y="90">vào top-10 sau rerank</text><rect class="tok" x="211" y="79" width="14" height="14" rx="3"/><text class="sub" x="231" y="90">trong top-50, rơi ở rerank</text><rect class="slot" x="20" y="103" width="14" height="14" rx="3"/><text class="sub" x="40" y="114">đã tới reranker, chưa đo</text><rect class="hatch" x="232" y="103" width="14" height="14" rx="3"/><text class="sub" x="252" y="114">không có trong top-50</text><text class="row" x="20" y="200">Trường hợp A</text><rect class="blue" x="201" y="172" width="313.0" height="44" rx="5"/><text class="cap mid halo" x="357.5" y="199.0">70% vào top-10</text><rect class="tok" x="516.0" y="172" width="65.50000000000001" height="44" rx="5"/><text class="cap mid halo" x="548.75" y="199.0">15%</text><rect class="hatch" x="583.5" y="172" width="65.50000000000001" height="44" rx="5"/><text class="cap mid halo" x="616.25" y="199.0">15%</text><line class="lfg" x1="515.0" y1="156" x2="515.0" y2="220"/><text class="sub end" x="511.0" y="166">Recall@10 = 0,70</text><line class="lfg" x1="582.5" y1="156" x2="582.5" y2="220"/><text class="sub" x="586.5" y="166">Recall@50 = 0,85</text><text class="cap" x="200" y="242">Retrieval ổn. Sửa rerank hoặc số đoạn đưa vào prompt.</text><text class="row" x="20" y="338">Trường hợp B</text><rect class="slot" x="201" y="310" width="223.0" height="44" rx="5"/><text class="cap mid halo" x="312.5" y="337.0">50% tới reranker</text><rect class="hatch" x="426.0" y="310" width="223.0" height="44" rx="5"/><text class="cap mid halo" x="537.5" y="337.0">50% không tới</text><line class="lfg" x1="425.0" y1="294" x2="425.0" y2="358"/><text class="sub" x="429.0" y="304">Recall@50 = 0,50</text><text class="cap" x="200" y="380">Reranker tốt mấy cũng không vượt 50%.</text><text class="cap" x="200" y="400">Sửa chunk, embedding, hoặc thêm BM25.</text></svg>
