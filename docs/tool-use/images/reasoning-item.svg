<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 392" width="812" height="392" role="img" aria-label="Gửi lại nguyên các item thì request hợp lệ; dựng lại lịch sử từ role, content, tool_calls làm rơi reasoning item đứng trước function_call và API trả 400"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
--blue:#0969da;--blue-bg:#ddf4ff;--orange:#bc4c00;--orange-bg:#fff1e5;
--red:#cf222e;--red-bg:#ffebe9;--green:#1a7f37;--green-bg:#dafbe1}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;
