</text><rect class="tok" x="741" y="27" width="14" height="14" rx="3"/><text class="sub" x="761" y="38">tool chạy trong code</text><text class="cap2" x="20" y="62">Hai hàng chạy cùng một đồng hồ; khối thẳng cột là cùng thời điểm.</text><text class="row" x="20" y="138">Song song</text><text class="sub" x="20" y="156">so sánh 2 đơn</text><text class="row" x="20" y="277">Tuần tự</text><text class="sub" x="20" y="295">tìm rồi huỷ</text><rect class="slot" x="130" y="262" width="110" height="34" rx="7"/><rect class="slot" x="254" y="262" width="184" height="34" rx="7"/><rect class="slot" x="452" y="262" width="110" height="34" rx="7"/><rect class="slot" x="576" y="262" width="184" height="34" rx="7"/><rect class="slot" x="774" y="262" width="110" height="34" rx="7"/><rect class="slot" x="130" y="125.0" width="110" height="34" rx="7"/><rect class="slot" x="452" y="125.0" width="110" height="34" rx="7"/><rect class="slot" x="254" y="104" width="184" height="34" rx="7"/><rect class="slot" x="254" y="146" width="184" height="34" rx="7"/><g class="a-show" style="animation:k1 18s linear infinite"><rect class="orange" x="130" y="125.0" width="110" height="34" rx="7"/><text class="lbl" style="font-size:13px" x="185.0" y="147.0">request 1</text></g><g class="a-show" style="animation:k2 18s linear infinite"><rect class="tok" x="254" y="104" width="184" height="34" rx="7"/><text class="lbl" style="font-size:13px" x="346.0" y="126.0">get_order DH-208431</text><rect class="tok" x="254" y="146" width="184" height="34" rx="7"/><text class="lbl" style="font-size:13px" x="346.0" y="168.0">get_order DH-208432</text></g><g class="a-show" style="animation:k3 18s linear infinite"><rect class="orange" x="452" y="125.0" width="110" height="34" rx="7"/><text class="lbl" style="font-size:13px" x="507.0" y="147.0">request 2</text><text class="sub mid" x="507.0" y="175.0">gửi cả 2 kết quả</text></g><g class="a-show" style="animation:k4 18s linear infinite"><rect class="orange" x="130" y="262" width="110" height="34" rx="7"/><text class="lbl" style="font-size:13px" x="185.0" y="284.0">request 1</text></g><g class="a-show" style="animation:k5 18s linear infinite"><rect class="tok" x="254" y="262" width="184" height="34" rx="7"/><text class="lbl" style="font-size:13px" x="346.0" y="284.0">list_recent_orders</text></g><g class="a-show" style="animation:k6 18s linear infinite"><rect class="orange" x="452" y="262" width="110" height="34" rx="7"/><text class="lbl" style="font-size:13px" x="507.0" y="284.0">request 2</text></g><g class="a-show" style="animation:k7 18s linear infinite"><rect class="tok" x="576" y="262" width="184" height="34" rx="7"/><text class="lbl" style="font-size:12px" x="668.0" y="284.0">cancel_order DH-208431</text><text class="sub mid" x="668.0" y="252">mã đơn lấy từ kết quả trước</text></g><g class="a-show" style="animation:k8 18s linear infinite"><rect class="orange" x="774" y="262" width="110" height="34" rx="7"/><text class="lbl" style="font-size:13px" x="829.0" y="284.0">request 3</text></g><g class="a-show" style="animation:k9 18s linear infinite"><text class="cap" x="576" y="147">Xong sau 2 request tới model.</text><text class="cap" x="130" y="326">Xong sau 3 request; mỗi request gửi lại toàn bộ lịch sử.</text></g><line class="axis" x1="130" y1="360" x2="878" y2="360" marker-end="url(#afg)"/><text class="sub end" x="878" y="378">thời gian</text><text class="cap2" x="20" y="390">Độ dài khối chỉ minh hoạ thứ tự, không phải thời gian đo được.</text></svg>
