">t5</text></g></g><g class="a-hide" style="animation:k2 16s linear infinite"><line class="lblue" x1="202.0" y1="132" x2="202.0" y2="198" marker-end="url(#ablue)"/><line class="lblue" x1="280.0" y1="132" x2="280.0" y2="198" marker-end="url(#ablue)"/><line class="lblue" x1="358.0" y1="132" x2="358.0" y2="198" marker-end="url(#ablue)"/><line class="lblue" x1="436.0" y1="132" x2="436.0" y2="198" marker-end="url(#ablue)"/><line class="lblue" x1="514.0" y1="132" x2="514.0" y2="198" marker-end="url(#ablue)"/><line class="lblue" x1="592.0" y1="132" x2="592.0" y2="198" marker-end="url(#ablue)"/></g><g class="a-show" style="animation:k3 16s linear infinite"><g ><rect class="blue" x="170" y="206" width="64" height="36" rx="7"/><text class="lbl" x="202.0" y="229.0">KV0</text></g><g ><rect class="blue" x="248" y="206" width="64" height="36" rx="7"/><text class="lbl" x="280.0" y="229.0">KV1</text></g><g ><rect class="blue" x="326" y="206" width="64" height="36" rx="7"/><text class="lbl" x="358.0" y="229.0">KV2</text></g><g ><rect class="blue" x="404" y="206" width="64" height="36" rx="7"/><text class="lbl" x="436.0" y="229.0">KV3</text></g><g ><rect class="blue" x="482" y="206" width="64" height="36" rx="7"/><text class="lbl" x="514.0" y="229.0">KV4</text></g><g ><rect class="blue" x="560" y="206" width="64" height="36" rx="7"/><text class="lbl" x="592.0" y="229.0">KV5</text></g></g><g class="a-hide" style="animation:k4 16s linear infinite"><rect class="lorange dash" x="165" y="201" width="464" height="46" rx="10"/><line class="lorange" x1="670.0" y1="132" x2="611" y2="197" marker-end="url(#aorange)"/><text class="sub mid torange" x="399.5" y="192">đọc KV của mọi token trước</text></g><g class="a-hide" style="animation:k5 16s linear infinite"><rect class="lorange dash" x="638" y="92" width="64" height="36" rx="7" style="fill:var(--bg)"/><text class="lbl" x="670.0" y="115.0">?</text></g><g class="a-show" style="animation:k6 16s linear infinite"><rect class="orange" x="638" y="92"