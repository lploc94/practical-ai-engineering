inear infinite"><rect class="orange" x="794" y="92" width="64" height="36" rx="7"/><text class="lbl" x="826.0" y="115.0">t8</text></g><g class="a-hide" style="animation:k17 16s linear infinite"><line class="lorange" x1="826.0" y1="132" x2="826.0" y2="198" marker-end="url(#aorange)"/></g><g class="a-show" style="animation:k18 16s linear infinite"><rect class="orange" x="794" y="206" width="64" height="36" rx="7"/><text class="lbl" x="826.0" y="229.0">KV8</text></g><g class="a-hide" style="animation:k19 16s linear infinite"><text class="title" x="20" y="44">Pha 1 · Prefill</text><text class="cap" x="20" y="292">Đọc toàn bộ prompt trong một lượt, tính KV cho mọi token song song.</text><text class="cap2" x="20" y="314">Tốn compute; quyết định time-to-first-token. Prompt caching giúp bỏ bớt pha này.</text></g><g class="a-hide" style="animation:k20 16s linear infinite"><text class="title" x="20" y="44">Pha 2 · Decode</text><text class="cap" x="20" y="292">Mỗi bước: token mới attend vào KV của mọi token trước → sinh 1 token → thêm KV của nó.</text><text class="cap2" x="20" y="314">Tuần tự từng token; bị giới hạn bởi băng thông bộ nhớ khi đọc KV cache.</text></g><g class="static-only"><text class="title" x="20" y="44">Prefill → Decode</text><text class="cap" x="20" y="292">Xanh: KV của prompt, tính song song trong một lượt (prefill).</text><text class="cap" x="20" y="314">Cam: token sinh tuần tự (decode); mỗi token đọc toàn bộ KV rồi thêm KV của nó.</text></g><rect class="blue" x="632" y="31" width="14" height="14" rx="3"/><text class="sub" x="652" y="42">từ prompt</text><rect class="orange" x="739" y="31" width="14" height="14" rx="3"/><text class="sub" x="759" y="42">token sinh ra</text></svg>
