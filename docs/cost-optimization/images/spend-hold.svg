<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Hạn mức 1,00 USD, đã tiêu 0,10, một request đang chạy giữ chỗ 0,80. Chỉ đếm số đã tiêu thì request mới 0,20 USD được cho qua và tổng có thể tới 1,10 USD; SpendLedger đếm cả phần giữ chỗ nên chặn request mới bằng BudgetExceeded"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
--blue:#0969da;--blue-bg:#ddf4ff;--orange:#bc4c00;--orange-bg:#fff1e5;
--red:#cf222e;--red-bg:#ffebe9;--green:#1a7f37;--green-bg:#dafbe1}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;
--slot:#3d444d;--tok:#151b23;--blue:#4493f8;--blue-bg:#0c2d6b;--orange:#db6d28;--orange-bg:#3d1e00;
--red:#f85149;--red-bg:#490202;--green:#3fb950;--green-bg:#033a16}}
.bg{fill:var(--bg)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.title{font-size:20px;font-weight:600}
.row{font-size:15px;font-weight:600}
.sub{font-size:12px;fill:var(--muted)}
.cap{font-size:14px}
.cap2{font-size:13px;fill:var(--muted)}
.lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;text-anchor:middle}
.mid{text-anchor:middle}.end{text-anchor:end}
.slot{fill:none;stroke:var(--slot);stroke-width:1.5;stroke-dasharray:4 4}
.tok{fill:var(--tok);stroke:var(--slot);stroke-width:1.5}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:2}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:2}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:2}
.hatch{fill:url(#hatch);stroke:var(--red);stroke-width:2}
.fblue{fill:var(--blue)}.forange{fill:var(--orange)}.fred{fill:var(--red)}.ffg{fill:var(--fg)}
.tblue{fill:var(--blue)}.torange{fill:var(--orange)}.tred{fill:var(--red)}
.lblue{stroke:var(--blue);stroke-width:2;fill:none}
.lorange{stroke:var(--orange);stroke-width:2;fill:none}
.lred{stroke:var(--red);stroke-width:2;fill:none}
.lmuted{stroke:var(--slot);stroke-width:1.5;fill:none}
.lfg{stroke:var(--fg);stroke-width:1.5;fill:none}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.dash{stroke-dasharray:6 4}
.grid{stroke:var(--slot);stroke-width:1;opacity:.6}
.axis{stroke:var(--muted);stroke-width:1}
.static-only{opacity:0}
@media (prefers-reduced-motion: reduce){
.a-show,.a-hide{animation:none!important}.a-show{opacity:1}.a-hide{opacity:0}.static-only{opacity:1}}
</style><defs><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fblue" d="M0,0L10,5L0,10z"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="forange" d="M0,0L10,5L0,10z"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fred" d="M0,0L10,5L0,10z"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ffg" d="M0,0L10,5L0,10z"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--red-bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--red);stroke-width:2;opacity:.55"/></pattern></defs><rect class="bg" width="820" height="380" rx="12"/><text class="title" x="20" y="38">Hạn mức phải đếm cả phần đang giữ chỗ</text><rect class="blue" x="20" y="59" width="14" height="14" rx="3"/><text class="sub" x="40" y="70">đã tiêu</text><rect class="orange" x="113" y="59" width="14" height="14" rx="3"/><text class="sub" x="133" y="70">request đang chạy</text><rect class="slot" x="276" y="59" width="14" height="14" rx="3"/><text class="sub" x="296" y="70">request mới, chưa chạy</text><text class="row" x="20" y="127">Chỉ đếm đã tiêu</text><text class="sub" x="20" y="144">0,10 + 0,20 ≤ 1,00: cho qua</text><rect class="blue" x="221.0" y="110" width="39.7" height="40" rx="5"/><text class="lbl" style="font-size:13px" x="240.8" y="135">0,10</text><rect class="orange" x="262.7" y="110" width="331.3" height="40" rx="5"/><text class="lbl" style="font-size:13px" x="428.3" y="135">0,80 không được đếm</text><rect class="orange" x="596.0" y="110" width="81.3" height="40" rx="5"/><text class="lbl" style="font-size:13px" x="616.3" y="135">0,20</text><text class="cap" x="686.3" y="135">có thể tới 1,10</text><text class="row" x="20" y="239">SpendLedger</text><text class="sub" x="20" y="256">0,10 + 0,80 + 0,20 &gt; 1,00: chặn</text><rect class="blue" x="221.0" y="222" width="39.7" height="40" rx="5"/><text class="lbl" style="font-size:13px" x="240.8" y="247">0,10</text><rect class="orange" x="262.7" y="222" width="331.3" height="40" rx="5"/><text class="lbl" style="font-size:13px" x="428.3" y="247">giữ chỗ 0,80</text><rect class="slot" x="596.0" y="222" width="81.3" height="40" rx="5"/><text class="lbl" style="font-size:13px" x="616.3" y="247">0,20</text><text class="cap" x="686.3" y="240" style="font-weight:600">bị chặn</text><text class="sub" x="686.3" y="256" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">BudgetExceeded</text><line class="lfg" x1="636.7" y1="94" x2="636.7" y2="274" style="stroke-width:2.5"/><text class="sub mid" x="636.7" y="88">hạn mức 1,00 USD</text><line class="axis" x1="220" y1="294" x2="720" y2="294"/><line class="axis" x1="220.0" y1="294" x2="220.0" y2="299"/><text class="sub mid" x="220.0" y="312">0,00</text><line class="axis" x1="324.2" y1="294" x2="324.2" y2="299"/><text class="sub mid" x="324.2" y="312">0,25</text><line class="axis" x1="428.3" y1="294" x2="428.3" y2="299"/><text class="sub mid" x="428.3" y="312">0,50</text><line class="axis" x1="532.5" y1="294" x2="532.5" y2="299"/><text class="sub mid" x="532.5" y="312">0,75</text><line class="axis" x1="636.7" y1="294" x2="636.7" y2="299"/><text class="sub mid" x="636.7" y="312">1,00</text><text class="sub" x="690" y="312">USD</text><text class="cap2" x="20" y="350">Request đang chạy chưa có chi phí thật nhưng có thể tiêu tới phần đã giữ chỗ. Bỏ qua nó thì hai request</text><text class="cap2" x="20" y="368">đồng thời cùng qua kiểm tra và tổng chi tiêu có thể tới 1,10 USD trên hạn mức 1,00.</text></svg>
