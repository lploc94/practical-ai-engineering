<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Kẻ tấn công mở issue chứa chỉ dẫn trong repo public. Nạn nhân nhờ agent xem các issue; agent đọc issue (A), làm theo chỉ dẫn đọc repo private (B), rồi đăng dữ liệu đó vào pull request công khai (C) mà kẻ tấn công đọc được. Không có lỗi code: lỗ hổng là ba thuộc tính trong cùng một phiên"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
--blue:#0969da;--blue-bg:#ddf4ff;--orange:#bc4c00;--orange-bg:#fff1e5;
--red:#cf222e;--red-bg:#ffebe9;--green:#1a7f37;--green-bg:#dafbe1}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;
--slot:#3d444d;--tok:#151b23;--blue:#4493f8;--blue-bg:#0c2d6b;--orange:#db6d28;--orange-bg:#3d1e00;
--red:#f85149;--red-bg:#490202;--green:#3fb950;--green-bg:#033a16}}
.bg{fill:var(--bg)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.title{font-size:20px;font-weight:600}
.row{font-size:15px;font-weight:600}
.sub{font-size:12px;fill:var(--muted)}
.cap{font-size:14px}
.cap2{font-size:13px;fill:var(--muted)}
.lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;text-anchor:middle}
.mid{text-anchor:middle}.end{text-anchor:end}
.slot{fill:none;stroke:var(--slot);stroke-width:1.5;stroke-dasharray:4 4}
.tok{fill:var(--tok);stroke:var(--slot);stroke-width:1.5}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:2}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:2}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:2}
.hatch{fill:url(#hatch);stroke:var(--red);stroke-width:2}
.fblue{fill:var(--blue)}.forange{fill:var(--orange)}.fred{fill:var(--red)}.ffg{fill:var(--fg)}
.tblue{fill:var(--blue)}.torange{fill:var(--orange)}.tred{fill:var(--red)}
.lblue{stroke:var(--blue);stroke-width:2;fill:none}
.lorange{stroke:var(--orange);stroke-width:2;fill:none}
.lred{stroke:var(--red);stroke-width:2;fill:none}
.lmuted{stroke:var(--slot);stroke-width:1.5;fill:none}
.lfg{stroke:var(--fg);stroke-width:1.5;fill:none}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.dash{stroke-dasharray:6 4}
.grid{stroke:var(--slot);stroke-width:1;opacity:.6}
.axis{stroke:var(--muted);stroke-width:1}
.static-only{opacity:0}
@media (prefers-reduced-motion: reduce){
.a-show,.a-hide{animation:none!important}.a-show{opacity:1}.a-hide{opacity:0}.static-only{opacity:1}}
</style><defs><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fblue" d="M0,0L10,5L0,10z"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="forange" d="M0,0L10,5L0,10z"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fred" d="M0,0L10,5L0,10z"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ffg" d="M0,0L10,5L0,10z"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--red-bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--red);stroke-width:2;opacity:.55"/></pattern></defs><rect class="bg" width="900" height="520" rx="12"/><text class="title" x="20" y="38">GitHub MCP: một phiên agent có đủ A, B và C</text><text class="cap2" x="20" y="62">Không có dòng code nào sai. Chỉ dẫn nằm trong issue, agent chạy với quyền của nạn nhân.</text><rect class="red" x="30" y="110" width="220" height="60" rx="7"/><text class="row mid halo" x="140.0" y="135">Kẻ tấn công</text><text class="sub mid halo" x="140.0" y="155">không cần quyền gì</text><rect class="red" x="340" y="110" width="220" height="60" rx="7"/><text class="row mid halo" x="450.0" y="135">Issue, repo public</text><text class="sub mid halo" x="450.0" y="155">chỉ dẫn viết cho AI</text><rect class="tok" x="30" y="260" width="220" height="60" rx="7"/><text class="row mid halo" x="140.0" y="285">Nạn nhân</text><text class="sub mid halo" x="140.0" y="305">“xem các issue đang mở”</text><rect class="tok" x="340" y="260" width="220" height="60" rx="7"/><text class="row mid halo" x="450.0" y="285">Agent của nạn nhân</text><text class="sub mid halo" x="450.0" y="305">quyền của nạn nhân</text><rect class="blue" x="650" y="260" width="220" height="60" rx="7"/><text class="row mid halo" x="760.0" y="285">Repo private</text><text class="sub mid halo" x="760.0" y="305">dữ liệu riêng</text><rect class="red" x="340" y="410" width="220" height="60" rx="7"/><text class="row mid halo" x="450.0" y="435">PR, repo public</text><text class="sub mid halo" x="450.0" y="455">ai cũng đọc được</text><path class="lred" marker-end="url(#ared)" d="M250,140.0H336"/><text class="cap mid halo" x="295.0" y="130.0">1. mở issue</text><path class="lfg" marker-end="url(#afg)" d="M250,290.0H336"/><text class="cap mid halo" x="295.0" y="280.0">2. nhờ việc</text><path class="lred" marker-end="url(#ared)" d="M450.0,170V256"/><circle class="tok" cx="474.0" cy="215.0" r="13" style="stroke:var(--fg)"/><text class="lbl" style="font-size:13px;font-weight:600" x="474.0" y="220.0">A</text><text class="cap halo" x="494.0" y="220.0">3. agent đọc issue</text><path class="lblue" marker-end="url(#ablue)" d="M650,290.0H564"/><circle class="tok" cx="605.0" cy="264.0" r="13" style="stroke:var(--fg)"/><text class="lbl" style="font-size:13px;font-weight:600" x="605.0" y="269.0">B</text><text class="cap mid halo" x="605.0" y="312.0">4. đọc</text><path class="lred" marker-end="url(#ared)" d="M450.0,320V406"/><circle class="tok" cx="474.0" cy="365.0" r="13" style="stroke:var(--fg)"/><text class="lbl" style="font-size:13px;font-weight:600" x="474.0" y="370.0">C</text><text class="cap halo" x="494.0" y="370.0">5. tạo PR chứa dữ liệu riêng</text><path class="lred dash" marker-end="url(#ared)" d="M340,440.0H210"/><text class="cap end halo" x="202" y="445.0">6. kẻ tấn công đọc</text><text class="cap2" x="20" y="504">A: nội dung không tin cậy. B: dữ liệu riêng. C: gửi ra ngoài. Thiếu một trong ba, chuỗi này đứt.</text></svg>
