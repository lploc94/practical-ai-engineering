<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 488" width="900" height="488" role="img" aria-label="Session cộng dồn thuộc tính của mọi tool đã gọi. Đọc đơn (B) rồi gửi email (C): không hỏi. Đọc đơn (B), đọc web (A) rồi gửi email: phải chờ người duyệt. Gửi email trước thì không hỏi, nhưng sau khi đọc email (A và B) thì lần gửi tiếp theo phải chờ duyệt"><style>
svg{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--slot:#d1d9e0;--tok:#f6f8fa;
--blue:#0969da;--blue-bg:#ddf4ff;--orange:#bc4c00;--orange-bg:#fff1e5;
--red:#cf222e;--red-bg:#ffebe9;--green:#1a7f37;--green-bg:#dafbe1}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;
--slot:#3d444d;--tok:#151b23;--blue:#4493f8;--blue-bg:#0c2d6b;--orange:#db6d28;--orange-bg:#3d1e00;
--red:#f85149;--red-bg:#490202;--green:#3fb950;--green-bg:#033a16}}
.bg{fill:var(--bg)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.title{font-size:20px;font-weight:600}
.row{font-size:15px;font-weight:600}
.sub{font-size:12px;fill:var(--muted)}
.cap{font-size:14px}
.cap2{font-size:13px;fill:var(--muted)}
.lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;text-anchor:middle}
.mid{text-anchor:middle}.end{text-anchor:end}
.slot{fill:none;stroke:var(--slot);stroke-width:1.5;stroke-dasharray:4 4}
.tok{fill:var(--tok);stroke:var(--slot);stroke-width:1.5}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:2}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:2}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:2}
.hatch{fill:url(#hatch);stroke:var(--red);stroke-width:2}
.fblue{fill:var(--blue)}.forange{fill:var(--orange)}.fred{fill:var(--red)}.ffg{fill:var(--fg)}
.tblue{fill:var(--blue)}.torange{fill:var(--orange)}.tred{fill:var(--red)}
.lblue{stroke:var(--blue);stroke-width:2;fill:none}
.lorange{stroke:var(--orange);stroke-width:2;fill:none}
.lred{stroke:var(--red);stroke-width:2;fill:none}
.lmuted{stroke:var(--slot);stroke-width:1.5;fill:none}
.lfg{stroke:var(--fg);stroke-width:1.5;fill:none}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.dash{stroke-dasharray:6 4}
.grid{stroke:var(--slot);stroke-width:1;opacity:.6}
.axis{stroke:var(--muted);stroke-width:1}
.static-only{opacity:0}
@media (prefers-reduced-motion: reduce){
.a-show,.a-hide{animation:none!important}.a-show{opacity:1}.a-hide{opacity:0}.static-only{opacity:1}}
</style><defs><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fblue" d="M0,0L10,5L0,10z"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="forange" d="M0,0L10,5L0,10z"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fred" d="M0,0L10,5L0,10z"/></marker><marker id="afg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ffg" d="M0,0L10,5L0,10z"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--red-bg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--red);stroke-width:2;opacity:.55"/></pattern></defs><rect class="bg" width="900" height="488" rx="12"/><text class="title" x="20" y="38">Session cộng dồn A, B, C; chỉ hỏi khi gọi C trong phiên có cả A và B</text><text class="cap2" x="20" y="62">Thuộc tính không bao giờ được gỡ khỏi phiên. Dưới mỗi ô: seen sau lời gọi.</text><text class="row" x="20" y="138">Test 1</text><text class="sub" x="20" y="156">B rồi C</text><rect class="tok" x="200" y="112" width="190" height="58" rx="7"/><text class="lbl" x="295.0" y="135">get_orders</text><text class="cap mid" x="295.0" y="156">mang B</text><text class="sub mid" x="295.0" y="188">seen = B</text><rect class="blue" x="414" y="112" width="190" height="58" rx="7"/><text class="lbl" x="509.0" y="135">send_email</text><text class="cap mid" x="509.0" y="156">C: chạy, không hỏi</text><text class="sub mid" x="509.0" y="188">seen = B C</text><path class="lfg" marker-end="url(#afg)" d="M392,141.0H411"/><text class="row" x="20" y="250">Test 3</text><text class="sub" x="20" y="268">B, A rồi C</text><rect class="tok" x="200" y="224" width="190" height="58" rx="7"/><text class="lbl" x="295.0" y="247">get_orders</text><text class="cap mid" x="295.0" y="268">mang B</text><text class="sub mid" x="295.0" y="300">seen = B</text><rect class="tok" x="414" y="224" width="190" height="58" rx="7"/><text class="lbl" x="509.0" y="247">fetch_url</text><text class="cap mid" x="509.0" y="268">mang A</text><text class="sub mid" x="509.0" y="300">seen = A B</text><path class="lfg" marker-end="url(#afg)" d="M392,253.0H411"/><rect class="orange" x="628" y="224" width="190" height="58" rx="7"/><text class="lbl" x="723.0" y="247">send_email</text><text class="cap mid" x="723.0" y="268">C: chờ người duyệt</text><text class="sub mid" x="723.0" y="300">seen = A B C</text><path class="lfg" marker-end="url(#afg)" d="M606,253.0H625"/><text class="row" x="20" y="362">Test 5</text><text class="sub" x="20" y="380">C trước, rồi A+B</text><rect class="blue" x="200" y="336" width="190" height="58" rx="7"/><text class="lbl" x="295.0" y="359">send_email</text><text class="cap mid" x="295.0" y="380">C: chạy, không hỏi</text><text class="sub mid" x="295.0" y="412">seen = C</text><rect class="tok" x="414" y="336" width="190" height="58" rx="7"/><text class="lbl" x="509.0" y="359">read_email</text><text class="cap mid" x="509.0" y="380">mang A B</text><text class="sub mid" x="509.0" y="412">seen = A B C</text><path class="lfg" marker-end="url(#afg)" d="M392,365.0H411"/><rect class="orange" x="628" y="336" width="190" height="58" rx="7"/><text class="lbl" x="723.0" y="359">send_email</text><text class="cap mid" x="723.0" y="380">C: chờ người duyệt</text><text class="sub mid" x="723.0" y="412">seen = A B C</text><path class="lfg" marker-end="url(#afg)" d="M606,365.0H625"/><rect class="blue" x="20" y="459" width="14" height="14" rx="3"/><text class="sub" x="40" y="470">C chạy luôn</text><rect class="orange" x="141" y="459" width="14" height="14" rx="3"/><text class="sub" x="161" y="470">C chờ người duyệt</text><rect class="tok" x="304" y="459" width="14" height="14" rx="3"/><text class="sub" x="324" y="470">tool chỉ đọc</text></svg>
